<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Inventario, kárdex, ajustes, traslados y productos. */

/* --- Inventario --- */
function vInventario(){
  const q = (UI.filtros.iq || "").toLowerCase(), cat = UI.filtros.icat || "";
  const cats = [...new Set(DB.productos.map(p => p.categoria))].sort();
  const list = DB.productos.filter(p => (!cat || p.categoria === cat) && (!q || (p.sku + " " + p.nombre + " " + p.compat).toLowerCase().includes(q)));
  const valor = sum(DB.productos, p => stockTotal(p) * p.costo);
  return `<div class="page-head"><div><h1>Inventario</h1><p>Existencias por sucursal, costo y alertas de stock mínimo. Cada movimiento queda en el kárdex con usuario y documento soporte.</p></div>
    <div class="row">${P("inventario.gestionar") ? `<button class="btn" data-act="trasladoDlg">Traslado entre sucursales</button><button class="btn primary" data-act="productoDlg">${icon("plus")} Nueva referencia</button>` : ""}</div></div>
  <section class="kpis" aria-label="Resumen de inventario" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <div class="kpi"><span class="l">Referencias activas</span><span class="v">${DB.productos.filter(p => p.activo).length}</span></div>
    <div class="kpi"><span class="l">Unidades en bodega</span><span class="v">${NUM.format(sum(DB.productos, stockTotal))}</span></div>
    <div class="kpi"><span class="l">Valor al costo</span><span class="v">${short(valor)}</span><span class="d muted">${money(valor)}</span></div>
    <div class="kpi"><span class="l">Importadas</span><span class="v">${DB.productos.filter(p => p.origen === "Importado").length}</span><span class="d muted">Zona Libre de Colón</span></div>
  </section>
  <div class="grid g2"><div class="field"><label for="iq">Buscar referencia</label><input id="iq" type="search" placeholder="SKU, nombre o moto compatible" value="${esc(UI.filtros.iq || "")}" data-in="iq"></div>
    <div class="field"><label for="icat">Categoría</label><select id="icat" data-ch="icat"><option value="">Todas</option>${cats.map(c => `<option ${cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div></div>
  <div class="tw"><table><caption class="sr">Inventario por sucursal</caption><thead><tr><th>SKU</th><th>Descripción</th><th>Compatible con</th>${DB.sucursales.map(s => `<th class="r">${esc(s.nombre.split(" ")[0])}</th>`).join("")}<th class="r">Total</th><th class="r">Mínimo</th><th class="r">Precio</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(p => { const t = stockTotal(p); const st = t < p.minimo ? ["Crítico","bad"] : t < p.minimo * 1.6 ? ["Bajo","warn"] : ["Normal","ok"]; return `<tr><td class="mono">${esc(p.sku)}</td><td>${esc(p.nombre)}<br><span class="muted" style="font-size:.8rem">${esc(p.categoria)} · ${esc(p.origen)}</span></td><td class="wrap muted">${esc(p.compat)}</td>${DB.sucursales.map(s => `<td class="r">${p.stock[s.id] || 0}</td>`).join("")}<td class="r"><b>${t}</b></td><td class="r">${p.minimo}</td><td class="r">${money(p.precio)}</td><td>${pill(st[0], st[1])}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="kardex" data-id="${p.id}">Kárdex</button>${P("inventario.gestionar") ? `<button class="btn sm" data-act="ajusteDlg" data-id="${p.id}">Ajustar</button>` : ""}</div></td></tr>`; }).join("") || `<tr><td colspan="12" class="empty">Sin resultados.</td></tr>`}
  </tbody></table></div>`;
}
function dlgKardex(id){
  const p = prod(id); const mv = DB.kardex.filter(k => k.productoId === id).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const ocultas = new Set(DB.facturas.filter(ocultarCantidades).map(f => f.numero)); // conteo ciego pendiente
  openDlg(`Kárdex · ${p.sku}`, `<p><b>${esc(p.nombre)}</b> · costo ${money(p.costo)} · garantía ${p.garantiaMeses ? p.garantiaMeses + " meses" : "no aplica"}</p>
  <div class="tw"><table><thead><tr><th>Fecha</th><th>Sucursal</th><th>Movimiento</th><th class="r">Cantidad</th><th>Documento</th><th>Usuario</th></tr></thead><tbody>${mv.map(k => `<tr><td>${fdt(k.fecha)}</td><td>${esc(suc(k.sucursalId)?.nombre.split(" ")[0])}</td><td>${esc(k.tipo)}</td><td class="r" style="color:${k.cantidad < 0 ? "var(--bad)" : "var(--ok)"}">${ocultas.has(k.ref) ? "—" : (k.cantidad > 0 ? "+" : "") + k.cantidad}</td><td class="mono">${esc(k.ref)}</td><td>${esc(k.usuario)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Sin movimientos.</td></tr>`}</tbody></table></div>`, `<button class="btn" data-act="cerrarDlg">Cerrar</button>`);
}
function dlgAjuste(id){

    <p class="muted">Los ajustes requieren motivo y quedan en la bitácora de auditoría. Usa valores negativos para salidas (daño, pérdida).</p>
    <div class="grid g2"><div class="field"><label for="aj-s">Sucursal</label><select id="aj-s" name="suc">${DB.sucursales.map(s => `<option value="${s.id}">${esc(s.nombre)} (${p.stock[s.id] || 0})</option>`).join("")}</select></div>

    <div class="field"><label for="aj-m">Motivo *</label><select id="aj-m" name="motivo"><option>Conteo físico (inventario cíclico)</option><option>Producto averiado</option><option>Devolución de cliente</option><option>Pérdida o hurto</option></select></div>

    `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn primary" type="submit" form="frm-aj">Registrar ajuste</button>`);
}
function dlgTraslado(){

    <div class="field"><label for="tr-p">Referencia</label><input id="tr-p" name="prod" type="text" list="dl-productos" autocomplete="off" placeholder="Escribe la referencia, el repuesto o la moto">${listaProductos()}</div>

    <div class="field"><label for="tr-d">Destino</label><select id="tr-d" name="d">${DB.sucursales.map((s, i) => `<option value="${s.id}" ${i === 1 ? "selected" : ""}>${esc(s.nombre)}</option>`).join("")}</select></div>
    <div class="field"><label for="tr-c">Cantidad</label><input id="tr-c" name="cant" type="number" min="1" required></div></div><div id="tr-err" role="alert"></div></form>`,
    `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn primary" type="submit" form="frm-tr">Registrar traslado</button>`);

function dlgProducto(){

    <div class="field"><label for="pr-sku">SKU *</label><input id="pr-sku" name="sku" required pattern="[A-Z0-9-]{4,20}" placeholder="FRE-DISC-220" aria-describedby="pr-sku-h"><span class="hint" id="pr-sku-h">Mayúsculas, números y guiones.</span></div>

<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Importaciones y costeo nacionalizado. */

/* --- Importaciones --- */

  return `<div class="page-head"><div><h1>Certificados de garantía</h1><p>Respaldan la autenticidad y el funcionamiento de los repuestos vendidos. Cada código está ligado a la factura electrónica y al cliente, y cualquiera puede verificarlo.</p></div></div>

}
function resultadoCert(code){
  const c = DB.certificados.find(x => x.codigo === code.trim().toUpperCase());
  if (!c) return `<div class="note bad" role="alert"><b>Código no encontrado.</b> Revisa que lo hayas escrito igual al impreso. Si persiste, el certificado podría no ser auténtico: comunícate con Motorepuestos del Oriente.</div>`;
  const f = byId(DB.facturas, c.facturaId), p = prod(c.productoId), vig = new Date(c.vence) > new Date();
  return `<div class="note ${vig ? "ok" : "warn"}"><b>${vig ? "Certificado auténtico y garantía vigente" : "Certificado auténtico, garantía vencida"}</b>
    <dl class="kv" style="margin-top:8px"><dt>Código</dt><dd class="mono">${c.codigo}</dd><dt>Repuesto</dt><dd>${esc(p.nombre)} (${esc(p.sku)}) × ${c.cantidad}</dd><dt>Comprado por</dt><dd>${esc(cli(c.clienteId).nombre)}</dd><dt>Factura</dt><dd class="mono">${f.numero} · ${fdate(f.fecha)}</dd><dt>Garantía hasta</dt><dd>${fdate(c.vence)}</dd></dl></div>`;
}

  if (tab === "datos") body = `<div class="note">En esta versión de demostración los datos se guardan en este navegador. Para pasarlos a otro equipo, copia el respaldo y pégalo allí en "Restaurar".</div>

<script>
"use strict";
/* Motorepuestos del Oriente
   Capa de presentación · Ventanas modales y avisos. */

/* ---------- Diálogos y avisos ---------- */
function openDlg(title, body, foot){
  const d = $("#dlg");
  d.innerHTML = `<div class="dlg-head"><h2 id="dlg-title">${esc(title)}</h2><button class="btn sm ghost" data-act="cerrarDlg" aria-label="Cerrar">✕</button></div><div class="dlg-body">${body}</div>${foot ? `<div class="dlg-foot">${foot}</div>` : ""}`;
  if (!d.open){ UI.lastFocus = document.activeElement; d.showModal(); }
  const first = d.querySelector(".dlg-body input:not([disabled]), .dlg-body select, .dlg-body textarea");
  (first || d.querySelector(".dlg-head button")).focus();
  regionesTeclado(d);
}
/* Las tablas que se desplazan a lo ancho deben poder enfocarse para recorrerlas con el teclado (WCAG 2.1.1) */
function regionesTeclado(raiz){ raiz.querySelectorAll(".tw").forEach(el => { if (el.scrollWidth > el.clientWidth + 1){ el.tabIndex = 0; el.setAttribute("role", "region"); el.setAttribute("aria-label", "Tabla desplazable"); } }); }
function closeDlg(){ const d = $("#dlg"); if (d.open) d.close(); UI.dlgCtx = null; }
$("#dlg").addEventListener("close", () => { UI.tab.fac = "doc"; UI.dlgCtx = null; if (UI.lastFocus && document.contains(UI.lastFocus)) UI.lastFocus.focus(); });
function toast(msg, bad){ const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 5000); }
function commit(){ save(); render(); }
</script>
<script>
"use strict";

  loginSel(d){ if (!CONFIG.modoDemo) return; const u = usr(d.id); $("#lg-user").value = u.usuario; $("#lg-pass").value = CONFIG.claveDemo; $("#lg-err").innerHTML = ""; $('form[data-form="login"] button[type=submit]')?.focus(); },

      ["U2","autorizaciones","Andrés · Gerente","Autorizar una factura manual pendiente: genera CUFE, asiento contable, certificados y correo. Intentar con la propia no es posible (segregación).","Control de facturas manuales"],
      ["U4","despachos","Julián · Despachos","Crear la remisión de una factura autorizada con instrucciones de envío. Note que no ve la cantidad facturada.","Instrucciones de envío completas"],
      ["U5","despachos","Diana · Bodega","Pestaña En proceso: abrir la remisión, ver la lista de alistamiento y marcarla como alistada.","Separación de funciones en bodega"],
      ["U4","despachos","Julián · Despachos","Hacer el conteo ciego con un número errado (bloquea la salida y abre novedad). Bodega vuelve a alistar y, con el conteo correcto, se sella.","Control de cantidades despachadas"],
      ["U4","despachos","Julián · Despachos","Pestaña En proceso: registrar la entrega de una remisión en tránsito con un faltante. Queda una novedad para Gerencia.","Control de entregas"],
      ["U6","trazabilidad","Mateo · Auditor","Rastrear una factura (pedido → factura → remisión) y verificar la integridad de la bitácora.","Trazabilidad de documentos"],
      ["U1","trazabilidad","Laura · Administradora","Simular una alteración de la bitácora: el sistema la detecta. Luego deshacer la simulación.","Registros que no se pueden alterar"],
      ["U2","notificaciones","Andrés · Gerente","Ver los correos enviados por cada transacción. Abrir el botón Accesibilidad y ajustar texto y contraste; mostrar la app en el celular.","Avisos, accesibilidad y uso en celular"]
    ];
    openDlg("Guía de demostración", `<p>Recorrido de unos 5 minutos que muestra todos los requisitos. Cada botón <b>Ir</b> cambia al usuario indicado y abre la pantalla.</p>
      <div class="tw"><table><thead><tr><th class="r">#</th><th>Usuario</th><th>Qué mostrar</th><th>Qué demuestra</th><th></th></tr></thead><tbody>
      ${pasos.map((p, i) => `<tr><td class="r num">${i + 1}</td><td>${esc(p[2])}</td><td class="wrap">${esc(p[3])}</td><td>${pill(p[4], "acc")}</td><td><button class="btn sm primary" data-act="demoPaso" data-u="${p[0]}" data-r="${p[1]}">Ir</button></td></tr>`).join("")}
      </tbody></table></div>
      <p class="muted" style="font-size:.85rem">Antes de presentar: Administración → Datos y respaldo → Restablecer datos de ejemplo, para empezar con todos los casos disponibles.</p>`, `<button class="btn" data-act="cerrarDlg">Cerrar</button>`);
  },
  demoPaso(d){
    if (!CONFIG.modoDemo) return;
    const u = usr(d.u); if (!u || !u.activo) return;
    if (!ME || ME.id !== u.id){ ME = u; store.set(SES_KEY, u.id); audit("Cambiar de usuario (demostración)", "Sesión", u.usuario, u.rol); save(); }

    if (location.hash === "#" + d.r) render(); else location.hash = d.r;
    toast(`Ahora estás como ${u.nombre} (${u.rol}).`);
  },
  logout(){ audit("Cerrar sesión", "Sesión", ME.usuario, ""); save(); ME = null; store.del(SES_KEY); UI.menuOpen = false; UI.draft = null; location.hash = ""; render(); },
  tab(d){ UI.tab[d.g] = d.v; if (d.g === "fac") dlgFactura(d.ref); else render(); },
  cerrarDlg(){ closeDlg(); },
  verFactura(d){ UI.tab.fac = "doc"; dlgFactura(d.id); },
  masFacturas(){ UI.filtros.flim = (UI.filtros.flim || 40) + 40; render(); },
  masPedidos(){ UI.filtros.plim = (UI.filtros.plim || 40) + 40; render(); },
  masCorreos(){ UI.filtros.nlim = (UI.filtros.nlim || 50) + 100; render(); },
  masAudit(){ UI.filtros.alim = (UI.filtros.alim || 60) + 100; render(); },
  addItem(){ UI.draft.items.push({ productoId:"", cantidad:1 }); render(); $(`#it-p-${UI.draft.items.length - 1}`)?.focus(); },
  delItem(d){ UI.draft.items.splice(+d.i, 1); render(); },
  cancelDraft(){ UI.draft = null; },
  autorizar(d){
    const f = byId(DB.facturas, d.id);
    if (!P("facturas.autorizar") || f.estado !== "Pendiente") return;
    if (f.creadoPor === ME.id){ toast("No puedes autorizar una factura que tú registraste.", true); return; }
    const c = cli(f.clienteId);
    if (f.total > cupoDisponible(c, f.id)){ toast("El cliente ya no tiene cupo suficiente para esta factura.", true); return; }
    const falt = f.items.find(it => (prod(it.productoId).stock[f.sucursalId] || 0) < it.cantidad);
    if (falt){ toast("No hay existencia suficiente de " + prod(falt.productoId).sku + " en la sucursal.", true); return; }
    autorizarFactura(DB, f, ME.id, new Date().toISOString());
    audit("Autorizar factura manual", "Factura", f.numero, "CUFE " + f.cufe.slice(0, 16) + "…");
    audit("Contabilizar factura autorizada", "Factura", f.numero, "Asiento " + f.asiento.numero + " · " + money(f.total));
    correo(DB, "Factura emitida", f, new Date().toISOString());
    closeDlg(); commit(); toast(`Factura ${f.numero} autorizada, contabilizada y enviada al cliente. Ya puede pasar a Despachos.`);
  },
  rechazarDlg(d){
    const f = byId(DB.facturas, d.id);
    if (f.creadoPor === ME.id){ toast("No puedes rechazar una factura que tú registraste.", true); return; }
    openDlg(`Rechazar factura ${f.numero}`, `<form id="frm-rz" data-form="rechazo" data-id="${f.id}" class="grid"><p>Logística verá el motivo para corregir la factura.</p>
      <div class="field"><label for="rz-m">Motivo del rechazo *</label><textarea id="rz-m" name="motivo" required minlength="10" placeholder="Ej.: el cliente pidió 10 kits de arrastre, no 16. Verificar con el pedido firmado."></textarea></div><div id="rz-err" role="alert"></div></form>`,
      `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn danger" type="submit" form="frm-rz">Rechazar factura</button>`);
  },
  pagar(d){ const f = byId(DB.facturas, d.id); f.pagada = true; f.pagoEn = new Date().toISOString(); audit("Registrar pago de factura", "Factura", f.numero, money(f.total) + " · libera cupo de " + cli(f.clienteId).nombre); correo(DB, "Pago registrado", f, f.pagoEn); save(); dlgFactura(f.id); render(); toast("Pago registrado. El cupo del cliente quedó liberado."); },
  verifCufe(d){
    const f = byId(DB.facturas, d.id); const ok = cufe(f) === f.cufe;
    const el = $("#cufe-res"); if (el) el.innerHTML = ok ? pill("Íntegro: el CUFE coincide con los valores del documento", "ok") : pill("Alterado: los valores no coinciden con el CUFE", "bad");
    audit("Verificar integridad de factura", "Factura", f.numero, ok ? "CUFE coincide" : "CUFE NO coincide"); save();
  },
  nuevaRemision(d){ dlgNuevaRemision(d.id); },
  verRemision(d){ dlgRemision(d.id); },
  alistar(d){
    const r = rem(d.id); if (!P("despachos.alistar") || r.estado !== "Alistamiento") return;
    r.alistadoPor = ME.id; r.alistadoEn = new Date().toISOString();
    audit("Alistar pedido en bodega", "Remisión", r.numero, "Listo para el conteo ciego de Despachos");
    commit(); dlgRemision(r.id); toast("Pedido alistado. Despachos ya puede hacer el conteo ciego.");
  },
  despachar(d){ const r = rem(d.id); r.estado = "En tránsito"; r.salidaEn = new Date().toISOString(); audit("Despachar remisión", "Remisión", r.numero, "Salida de bodega · " + r.instrucciones.transportadora); correo(DB, "Despacho", r, r.salidaEn); closeDlg(); commit(); toast(`Remisión ${r.numero} en tránsito. Se avisó al cliente por correo.`); },
  facturarPedido(d){
    const p = byId(DB.pedidos, d.id); if (!P("pedidos.gestionar") || p.estado !== "Registrado") return;
    const c = cli(p.clienteId);
    if (p.total > cupoDisponible(c, p.id)){ toast(`Cupo insuficiente: ${c.nombre} tiene ${money(cupoDisponible(c, p.id))} disponibles.`, true); return; }
    const falt = p.items.find(it => (prod(it.productoId).stock[p.sucursalId] || 0) < it.cantidad);
    if (falt){ toast("No hay existencia suficiente de " + prod(falt.productoId).sku + " en la sucursal.", true); return; }
    const ts = new Date().toISOString();
    const f = buildFactura(DB, p.clienteId, p.sucursalId, p.ciudadDestinoId, p.items.map(x => ({ ...x })), ts, ME.id, p);
    if (p.obs) f.obs = p.obs;
    audit("Facturar pedido de venta", "Factura", f.numero, "Pedido " + p.numero + " · " + money(f.total));
    autorizarFactura(DB, f, "SYS", ts);
    audit("Contabilizar factura (automática, origen pedido)", "Factura", f.numero, "Asiento " + f.asiento.numero + " · CUFE " + f.cufe.slice(0, 16) + "…");

    commit(); toast(`Pedido ${p.numero} facturado como ${f.numero}, contabilizado y enviado al cliente.`);
  },
  anularPedidoDlg(d){ const p = byId(DB.pedidos, d.id); openDlg(`Anular pedido ${p.numero}`, `<form id="frm-an" data-form="anular" data-id="${p.id}" class="grid"><div class="field"><label for="an-m">Motivo de la anulación *</label><textarea id="an-m" name="motivo" required minlength="10" placeholder="Ej.: el cliente canceló por teléfono el 4 de noviembre."></textarea></div></form>`, `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn danger" type="submit" form="frm-an">Anular pedido</button>`); },
  verCorreo(d){ const m = byId(DB.correos, d.id); openDlg(m.asunto, `<dl class="kv"><dt>De</dt><dd>notificaciones@motorepuestosoriente.example</dd><dt>Para</dt><dd>${esc(m.contacto)} &lt;${esc(m.para)}&gt;</dd><dt>Fecha</dt><dd>${fdt(m.ts)}</dd><dt>Tipo</dt><dd>${esc(m.tipo)} · <span class="mono">${esc(m.ref)}</span></dd><dt>Estado</dt><dd>${pill(m.estado, m.estado === "Enviado" ? "ok" : "warn")}</dd></dl><div class="doc" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.cuerpo)}</div>`, `<button class="btn" data-act="cerrarDlg">Cerrar</button>`); },
  cerrarNovDlg(d){ openDlg("Cerrar novedad", `<form id="frm-nv" data-form="novedad" data-id="${d.id}" class="grid"><div class="field"><label for="nv-r">Resolución *</label><textarea id="nv-r" name="res" required minlength="10" placeholder="Qué se hizo: reposición, nota crédito, reclamación a la transportadora…"></textarea></div></form>`, `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn primary" type="submit" form="frm-nv">Cerrar novedad</button>`); },
  kardex(d){ dlgKardex(d.id); },
  ajusteDlg(d){ dlgAjuste(d.id); },
  trasladoDlg(){ dlgTraslado(); },
  productoDlg(){ dlgProducto(); },
  importDlg(){ dlgNuevaImport(); },
  verImport(d){ dlgImport(d.id); },
  avanzarImport(d){
    const im = byId(DB.importaciones, d.id); const i = FLUJO_IMP.indexOf(im.estado); const sig = FLUJO_IMP[i + 1]; if (!sig) return;
    if (sig === "Nacionalizada" && !im.dim) im.dim = "48" + String(Date.now()).slice(-13);
    if (sig === "Recibida"){
      const k = costeo(im); const ts = new Date().toISOString();
      im.items.forEach(it => {
        const p = prod(it.productoId); const cu = Math.round(it.fobUSD * im.trm * k.factor);
        const prev = stockTotal(p); p.costo = Math.round((p.costo * prev + cu * it.cantidad) / (prev + it.cantidad)); // costo promedio ponderado
        p.stock[im.sucursalId] = (p.stock[im.sucursalId] || 0) + it.cantidad;
        DB.kardex.push({ fecha:ts, productoId:p.id, sucursalId:im.sucursalId, tipo:"Entrada importación", cantidad:it.cantidad, ref:im.numero, usuario:ME.nombre });
      });
      im.recibida = ts;
      audit("Recibir importación en bodega", "Importación", im.numero, NUM.format(sum(im.items, x => x.cantidad)) + " unidades · costo promedio actualizado");
    } else audit("Cambiar estado importación", "Importación", im.numero, im.estado + " → " + sig + (sig === "Nacionalizada" ? " · DIM " + im.dim : ""));
    im.estado = sig; commit(); toast(`${im.numero}: ${sig}.`);
  },
  clienteDlg(d){ dlgCliente(d.id); },
  verifCadena(){ UI.cadena = verificarCadena(); audit("Verificar integridad de la bitácora", "Sistema", "", UI.cadena.ok ? "Cadena íntegra" : "Cadena rota en #" + UI.cadena.seq); if (UI.cadena.ok) UI.cadena.n = DB.audit.length; save(); render(); },

    if (!e) return; UI.fraude = { seq:e.seq, detalle:e.detalle }; e.detalle = e.detalle.replace(/\$\s?[\d.]+/, "$ 1.000"); UI.cadena = verificarCadena(); save(); render(); toast("Se alteró el valor del registro #" + e.seq + " directamente, sin pasar por el sistema.");

<script>
"use strict";

const FORM = {
  noop(){},
  login(form){

    if (!nombre || !clave) return err("Escribe tu usuario y tu contraseña.");

    if (b.hasta && new Date(b.hasta) > new Date()){ const min = Math.ceil((new Date(b.hasta) - new Date()) / 60000); return err(`Usuario bloqueado por intentos fallidos. Intenta de nuevo en ${min} ${min === 1 ? "minuto" : "minutos"}.`); }
    const u = DB.usuarios.find(x => x.usuario.toLowerCase() === nombre);

      b.fallos = (b.hasta ? 0 : b.fallos) + 1; b.hasta = null;

      DB.bloqueos[nombre] = b;
      audit(b.hasta ? "Bloquear usuario por intentos fallidos" : "Intento de ingreso fallido", "Sesión", nombre, b.hasta ? `${CONFIG.intentosMaximos} intentos fallidos · bloqueo de ${CONFIG.minutosBloqueo} min` : "Usuario o contraseña incorrectos", { user:{ nombre:"Sistema", rol:"Sistema" } }); save();
      return err(b.hasta ? `Demasiados intentos fallidos. El usuario queda bloqueado ${CONFIG.minutosBloqueo} minutos.` : `Usuario o contraseña incorrectos. Te ${CONFIG.intentosMaximos - b.fallos === 1 ? "queda 1 intento" : `quedan ${CONFIG.intentosMaximos - b.fallos} intentos`}.`);
    }
    if (!u.activo) return err("Este usuario está desactivado. Habla con el administrador.");
    delete DB.bloqueos[nombre];
    ME = u; store.set(SES_KEY, u.id); UI.a11yOpen = false; UI.publico = false;
    audit("Iniciar sesión", "Sesión", u.usuario, u.rol); save();
    if (!location.hash || location.hash === "#certificados") location.hash = "inicio";
    render(); $("#main")?.focus();
  },
  factura(){
    const d = UI.draft; const E = {};
    const items = d.items.filter(it => it.productoId);
    if (!d.clienteId) E.clienteId = d.cliTxt && d.cliTxt.trim() ? "No encontramos ese cliente. Elígelo de la lista de sugerencias." : "Elige el cliente.";
    if (!d.ciudadId) E.ciudadId = "Elige la ciudad o municipio de destino.";
    if (!items.length) E.items = "Agrega al menos una referencia.";
    const sinElegir = d.items.findIndex(it => !it.productoId && it.txt && it.txt.trim());
    if (sinElegir >= 0) E.items = `La línea ${sinElegir + 1} no tiene una referencia válida: elígela de la lista de sugerencias.`;
    const ids = items.map(x => x.productoId);
    if (new Set(ids).size !== ids.length) E.items = "Hay referencias repetidas. Une las cantidades en una sola línea.";
    for (const it of items){
      const q = Number(it.cantidad); const p = prod(it.productoId);
      if (!(Number.isInteger(q) && q > 0)){ E.items = `La cantidad de ${p.sku} debe ser un número entero mayor que cero.`; break; }
      if (q > (p.stock[d.sucursalId] || 0)){ E.items = `No hay existencia suficiente de ${p.sku} en ${suc(d.sucursalId).nombre}: hay ${p.stock[d.sucursalId] || 0}, pides ${q}.`; break; }
    }
    const lines = items.map(it => ({ productoId:it.productoId, cantidad:parseInt(it.cantidad), precio:prod(it.productoId).precio }));
    if (!Object.keys(E).length){
      const c = cli(d.clienteId); const t = calcTotales(lines); const disp = cupoDisponible(c);
      audit("Validar cupo del cliente", "Cliente", c.nit, t.total <= disp ? "Cupo suficiente: " + money(disp) : "Cupo insuficiente: disponible " + money(disp) + ", solicitado " + money(t.total));
      if (t.total > disp) E._general = `Cupo insuficiente: ${c.nombre} tiene ${money(disp)} disponibles y la factura suma ${money(t.total)}.`;
    }
    d.errores = E;
    if (Object.keys(E).length){ save(); render(); const first = $('[aria-invalid="true"]') || $('[role="alert"]'); first?.focus?.(); if (first && first.getAttribute("role") === "alert"){ first.setAttribute("tabindex", "-1"); first.focus(); } return; }
    const ts = new Date().toISOString();
    if (d.modo === "pedido"){
      const pd = buildPedido(DB, d.clienteId, d.sucursalId, d.ciudadId, lines, ts, ME.id);
      if (d.obs.trim()) pd.obs = d.obs.trim();
      audit("Registrar pedido de venta", "Pedido", pd.numero, cli(pd.clienteId).nombre + " · " + money(pd.total));
      correo(DB, "Pedido de venta", pd, ts);
      UI.draft = null; save(); location.hash = "pedidos"; toast(`Pedido ${pd.numero} registrado. Se envió la confirmación a ${cli(pd.clienteId).email || "el cliente"}.`);
      return;
    }
    const f = buildFactura(DB, d.clienteId, d.sucursalId, d.ciudadId, lines, ts, ME.id);
    if (d.obs.trim()) f.obs = d.obs.trim();
    audit("Registrar factura manual", "Factura", f.numero, cli(f.clienteId).nombre + " · " + money(f.total));
    UI.draft = null; save(); location.hash = "facturas"; toast(`Factura ${f.numero} registrada y enviada a Gerencia para autorización.`);
  },
  rechazo(form){
    const f = byId(DB.facturas, form.dataset.id); const m = form.motivo.value.trim();
    if (m.length < 10){ $("#rz-err").innerHTML = `<div class="note bad">Explica el motivo con al menos 10 caracteres para que Logística pueda corregir.</div>`; form.motivo.focus(); return; }
    f.estado = "Rechazada"; f.motivoRechazo = m; f.revisadoPor = ME.id; f.revisadoEn = new Date().toISOString();

  },
  remision(form){
    const f = byId(DB.facturas, form.dataset.id); const v = Object.fromEntries(new FormData(form));
    const err = [];
    if (!v.direccion.trim() || !v.contacto.trim() || !v.telefono.trim()) err.push("Completa dirección, quién recibe y teléfono.");
    if (!/^[0-9 +()-]{7,}$/.test(v.telefono.trim())) err.push("El teléfono debe tener al menos 7 dígitos.");
    if (v.transportadora !== "Flota propia" && !v.guia.trim()) err.push("Escribe el número de guía de la transportadora.");
    if (err.length){ $("#rem-err").innerHTML = `<div class="note bad">${err.map(esc).join("<br>")}</div>`; return; }
    const r = buildRemision(DB, f, new Date().toISOString(), { direccion:v.direccion.trim(), referencia:v.referencia.trim(), contacto:v.contacto.trim(), telefono:v.telefono.trim(), transportadora:v.transportadora, guia:v.guia.trim(), franja:v.franja, observaciones:v.observaciones.trim() });
    audit("Registrar despacho", "Remisión", r.numero, "Factura " + f.numero);
    audit("Registrar instrucciones de envío", "Remisión", r.numero, r.instrucciones.transportadora + (r.instrucciones.guia ? " · guía " + r.instrucciones.guia : "") + " · " + r.instrucciones.direccion);
    save(); render(); dlgRemision(r.id); toast(`Remisión ${r.numero} creada. Bodega debe alistarla antes del conteo ciego.`);
  },
  conteo(form){
    const r = rem(form.dataset.id);
    if (!P("despachos.gestionar") || r.estado !== "Alistamiento") return;
    if (!r.alistadoPor){ $("#conteo-res").innerHTML = `<div class="note bad">Bodega aún no ha alistado este pedido.</div>`; return; }
    if (r.alistadoPor === ME.id){ $("#conteo-res").innerHTML = `<div class="note bad">Quien alistó no puede hacer el conteo de verificación.</div>`; return; }
    const alisto = usr(r.alistadoPor)?.nombre || "—";
    const vals = r.items.map((_, i) => form["c" + i].value);
    if (vals.some(v => v === "" || !(Number.isInteger(Number(v)) && Number(v) >= 0))){ $("#conteo-res").innerHTML = `<div class="note bad">Escribe en todas las líneas la cantidad contada, en unidades enteras.</div>`; return; }
    r.items.forEach((it, i) => it.contado = parseInt(vals[i]));
    const dif = r.items.filter(it => it.contado !== it.cantidad);
    if (dif.length){
      const det = difDetalle(DB, r.items, "contado") + ` · Alistó: ${alisto} · Contó: ${ME.nombre}`;
      DB.novedades.push({ id:"N" + nextNum("NOV"), tipo:"Alistamiento", remisionId:r.id, facturaId:r.facturaId, fecha:new Date().toISOString(), usuario:ME.nombre, detalle:det, estado:"Abierta", resolucion:"" });
      audit("Discrepancia en conteo de alistamiento", "Remisión", r.numero, det);
      r.items.forEach(it => it.contado = null); r.alistadoPor = null; r.alistadoEn = null; r.conteoFallido = dif.length; save(); render(); dlgRemision(r.id);
      toast("El conteo no coincide: la remisión no sale y vuelve a Bodega.", true); return;
    }
    delete r.conteoFallido; r.estado = "Verificada"; r.verificadaEn = new Date().toISOString(); r.sello = sha(r.numero + r.verificadaEn).slice(0, 10).toUpperCase();
    audit("Verificar alistamiento (conteo ciego)", "Remisión", r.numero, `Conteo conforme · sello ${r.sello} · alistó ${alisto}`);
    save(); render(); dlgRemision(r.id); toast("Conteo conforme. La remisión quedó sellada y lista para salir.");
  },
  entrega(form){
    const r = rem(form.dataset.id); const rec = form.recibe.value.trim();
    if (!rec){ form.recibe.focus(); return; }
    r.items.forEach((it, i) => it.recibido = Math.max(0, parseInt(form["r" + i].value) || 0));
    r.recibidoPor = rec; r.entregadaEn = new Date().toISOString();
    const dif = r.items.filter(it => it.recibido !== it.cantidad);
    if (dif.length){
      r.estado = "Con novedad"; const det = difDetalle(DB, r.items, "recibido");
      DB.novedades.push({ id:"N" + nextNum("NOV"), tipo:"Entrega", remisionId:r.id, facturaId:r.facturaId, fecha:r.entregadaEn, usuario:ME.nombre, detalle:det, estado:"Abierta", resolucion:"" });
      audit("Registrar entrega con novedad", "Remisión", r.numero, det);
      toast("Entrega registrada con novedad. Gerencia debe resolverla.", true);
    } else { r.estado = "Entregada"; audit("Registrar entrega conforme", "Remisión", r.numero, "Recibe " + rec); toast(`Remisión ${r.numero} entregada sin novedades.`); }
    closeDlg(); commit();
  },
  anular(form){
    const p = byId(DB.pedidos, form.dataset.id); const m = form.motivo.value.trim();
    if (m.length < 10){ form.motivo.focus(); return; }
    p.estado = "Anulado"; p.motivoAnulacion = m; audit("Anular pedido de venta", "Pedido", p.numero, m); closeDlg(); commit(); toast(`Pedido ${p.numero} anulado. Se liberó el cupo del cliente.`);
  },
  estado(form){
    if (!P("admin.catalogos")){ toast("No tienes permiso para gestionar catálogos.", true); return; }
    const code = form.codigo.value.trim().toUpperCase(), nom = form.nombre.value.trim();
    if (!nom || !/^[A-Z]{2,5}$/.test(code)){ toast("Escribe el nombre y un código de 2 a 5 letras.", true); return; }
    if (DB.estados.some(e => e.id === code)){ toast("Ya existe un departamento o estado con ese código.", true); return; }
    DB.estados.push({ id:code, paisId:form.paisId.value, nombre:nom }); audit("Crear departamento o estado", "Catálogo", code, nom + " · " + byId(DB.paises, form.paisId.value).nombre); commit(); toast(nom + " agregado.");
  },
  novedad(form){
    const n = byId(DB.novedades, form.dataset.id); const v = form.res.value.trim();
    if (v.length < 10){ form.res.focus(); return; }
    n.estado = "Cerrada"; n.resolucion = v; audit("Cerrar novedad", "Remisión", rem(n.remisionId).numero, v); closeDlg(); commit(); toast("Novedad cerrada.");
  },
  ajuste(form){
    const p = prod(form.dataset.id); const s = form.suc.value; const c = Number(form.cant.value); const det = form.detalle.value.trim();
    if (!Number.isInteger(c)){ $("#aj-err").innerHTML = `<div class="note bad">La cantidad debe ser un número entero de unidades.</div>`; return; }
    if (!c){ $("#aj-err").innerHTML = `<div class="note bad">La cantidad debe ser distinta de cero.</div>`; return; }
    if (det.length < 10){ $("#aj-err").innerHTML = `<div class="note bad">Describe el ajuste con al menos 10 caracteres.</div>`; return; }
    if ((p.stock[s] || 0) + c < 0){ $("#aj-err").innerHTML = `<div class="note bad">El ajuste dejaría existencia negativa (hay ${p.stock[s] || 0}).</div>`; return; }
    p.stock[s] = (p.stock[s] || 0) + c;
    DB.kardex.push({ fecha:new Date().toISOString(), productoId:p.id, sucursalId:s, tipo:"Ajuste: " + form.motivo.value, cantidad:c, ref:"AJ-" + String(nextNum("AJ")).padStart(4, "0"), usuario:ME.nombre });
    audit("Ajustar inventario", "Producto", p.sku, `${c > 0 ? "+" : ""}${c} en ${suc(s).nombre} · ${form.motivo.value} · ${det}`); closeDlg(); commit(); toast("Ajuste registrado.");
  },
  traslado(form){
    const p = productoPorEtiqueta(form.prod.value), o = form.o.value, d = form.d.value, c = Number(form.cant.value);

    if (!(Number.isInteger(c) && c > 0) || c > (p.stock[o] || 0)){ $("#tr-err").innerHTML = `<div class="note bad">Cantidad no válida. En ${esc(suc(o).nombre)} hay ${p.stock[o] || 0}.</div>`; return; }
    p.stock[o] -= c; p.stock[d] = (p.stock[d] || 0) + c; const ref = "TR-" + String(nextNum("TR")).padStart(4, "0"); const ts = new Date().toISOString();
    DB.kardex.push({ fecha:ts, productoId:p.id, sucursalId:o, tipo:"Traslado salida", cantidad:-c, ref, usuario:ME.nombre }, { fecha:ts, productoId:p.id, sucursalId:d, tipo:"Traslado entrada", cantidad:c, ref, usuario:ME.nombre });
    audit("Trasladar inventario", "Producto", p.sku, `${c} de ${suc(o).nombre} a ${suc(d).nombre} · ${ref}`); closeDlg(); commit(); toast(`Traslado ${ref} registrado.`);
  },
  producto(form){
    const v = Object.fromEntries(new FormData(form)); const sku = v.sku.trim().toUpperCase();
    if (!/^[A-Z0-9-]{4,20}$/.test(sku)){ $("#pr-err").innerHTML = `<div class="note bad">El SKU solo admite mayúsculas, números y guiones (4 a 20).</div>`; return; }

    if (+v.precio <= +v.costo){ $("#pr-err").innerHTML = `<div class="note bad">El precio de venta debe ser mayor que el costo.</div>`; return; }
    const p = { id:"PR" + (DB.productos.length + 1) + "-" + Date.now().toString(36), sku, nombre:v.nombre.trim(), compat:v.compat.trim() || "Universal", categoria:v.categoria.trim(), costo:+v.costo, precio:+v.precio, minimo:+v.minimo || 0, stock:Object.fromEntries(DB.sucursales.map(s => [s.id, 0])), origen:v.origen, garantiaMeses:+v.garantia || 0, activo:true };
    DB.productos.push(p); audit("Crear referencia", "Producto", sku, p.nombre + " · " + money(p.precio)); closeDlg(); commit(); toast("Referencia creada. Su existencia inicial es cero.");
  },
  importacion(form){
    const items = DB.productos.filter(p => p.origen === "Importado").map(p => ({ productoId:p.id, cantidad:parseInt(form["q_" + p.id].value) || 0, fobUSD:parseFloat(form["u_" + p.id].value) || 0 })).filter(x => x.cantidad > 0);
    if (!items.length){ $("#im-err").innerHTML = `<div class="note bad">Escribe la cantidad de al menos una referencia.</div>`; return; }

    DB.importaciones.push(im); audit("Crear orden de importación", "Importación", im.numero, items.length + " referencias · FOB " + USD.format(costeo(im).fob)); closeDlg(); commit(); toast(`Orden ${im.numero} emitida.`);
  },
  cliente(form){
    const v = Object.fromEntries(new FormData(form)); const id = form.dataset.id;
    const nit = v.nit.trim();
    const err = [];
    if (!v.nombre.trim() || !v.direccion.trim() || !v.contacto.trim() || !v.telefono.trim()) err.push("Completa los campos obligatorios.");

    if (err.length){ $("#cl-err").innerHTML = `<div class="note bad">${err.map(esc).join("<br>")}</div>`; return; }
    if (id){
      const c = cli(id); const antes = c.cupo;
      Object.assign(c, { email:v.email.trim(), nombre:v.nombre.trim(), nit, ciudadId:v.ciudadId, direccion:v.direccion.trim(), contacto:v.contacto.trim(), telefono:v.telefono.trim(), autorizaDatos:true });
      if (v.cupo !== undefined && +v.cupo !== antes){ c.cupo = +v.cupo; audit("Modificar cupo de cliente", "Cliente", c.nit, money(antes) + " → " + money(c.cupo)); }

  rastreo(form){
    const q = form.doc.value.trim().toUpperCase();
    const refs = new Set([q]);
    let f = DB.facturas.find(x => x.numero === q);
    const r0 = DB.remisiones.find(x => x.numero === q); if (r0) f = byId(DB.facturas, r0.facturaId);

  // Agrega un municipio del catálogo oficial del DANE; si su departamento no existe, lo crea.
  ciudadDane(form){
    if (!P("admin.catalogos")){ toast("No tienes permiso para gestionar catálogos.", true); return; }
    const txt = form.etiqueta.value.trim(), code = (txt.match(/(\d{5})\s*$/) || [])[1], m = code && daneMunicipio(code);
    if (!m){ toast(txt ? "No encontramos ese municipio en el catálogo del DANE. Elige una de las sugerencias." : "Escribe el municipio y elige una sugerencia.", true); $("#g-dane")?.focus(); return; }
    if (DB.ciudades.some(c => c.id === m[0])){ toast(m[1] + " ya está registrado.", true); return; }
    const dep = asegurarDepartamento(DB, m[0]);
    DB.ciudades.push({ id:m[0], estadoId:dep.id, nombre:m[1] }); audit("Agregar municipio del catálogo DANE", "Catálogo", m[0], m[1] + " · " + dep.nombre); commit(); toast(`${m[1]} (${dep.nombre}) agregado.`); $("#g-dane")?.focus();
  },
  // Agrega de una vez todos los municipios que falten de un departamento.
  deptoDane(form){
    if (!P("admin.catalogos")){ toast("No tienes permiso para gestionar catálogos.", true); return; }
    const d = daneDepto(form.depto.value); if (!d) return;
    const nuevos = DANE.municipios.filter(m => m[0].startsWith(d[0]) && !DB.ciudades.some(c => c.id === m[0]));
    if (!nuevos.length){ toast(d[1] + " ya tiene todos sus municipios.", true); return; }
    const dep = asegurarDepartamento(DB, d[0]);
    nuevos.forEach(m => DB.ciudades.push({ id:m[0], estadoId:dep.id, nombre:m[1] }));
    audit("Agregar departamento del catálogo DANE", "Catálogo", d[0], `${d[1]} · ${nuevos.length} municipios`); commit(); toast(`${d[1]}: ${nuevos.length} municipios agregados.`);
  },
  ciudad(form){
    if (!P("admin.catalogos")){ toast("No tienes permiso para gestionar catálogos.", true); return; }
    const code = form.codigo.value.trim().toUpperCase(), nom = form.nombre.value.trim();
    if (!nom || !/^[0-9A-Z-]{3,8}$/.test(code)){ toast("Escribe el nombre y un código válido.", true); return; }
    if (DB.ciudades.some(c => c.id === code)){ toast("Ya existe una ciudad con ese código.", true); return; }
    DB.ciudades.push({ id:code, estadoId:form.estadoId.value, nombre:nom }); audit("Crear ciudad o municipio", "Catálogo", code, nom); commit(); toast(nom + " agregado.");
  },
  usuario(form){
    const v = Object.fromEntries(new FormData(form));
    if (!v.nombre.trim() || !/^[a-z0-9.]{3,20}$/.test(v.usuario)){ $("#us-err").innerHTML = `<div class="note bad">Completa el nombre y un usuario válido (minúsculas, 3 a 20).</div>`; return; }
    if (DB.usuarios.some(u => u.usuario === v.usuario)){ $("#us-err").innerHTML = `<div class="note bad">Ese usuario ya existe.</div>`; return; }
    const u = { id:"U" + (DB.usuarios.length + 1) + "-" + Date.now().toString(36), nombre:v.nombre.trim(), usuario:v.usuario, rol:v.rol, sucursalId:v.suc, activo:true, claveHash:hashClave(v.usuario, CONFIG.claveDemo) };
    DB.usuarios.push(u); audit("Crear usuario", "Usuario", u.usuario, u.nombre + " · " + u.rol); closeDlg(); commit(); toast(`Usuario ${u.usuario} creado. Su contraseña inicial es ${CONFIG.claveDemo}.`);
  },
  restaurar(form){
    try { const d = JSON.parse(form.json.value); if (!d || d.version !== 7 || !Array.isArray(d.facturas)) throw 0; DB = d; ME = usr(ME.id) || DB.usuarios[0]; audit("Restaurar respaldo", "Sistema", "", "Datos restaurados desde JSON"); commit(); toast("Respaldo restaurado."); }
    catch(e){ toast("El texto no es un respaldo válido de este sistema.", true); }
  }
};
</script>
<script>
"use strict";
/* Motorepuestos del Oriente
   Capa de control · Delegación de eventos del navegador hacia acciones y formularios. */

/* ---------- Eventos (delegación) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.tagName === "A" && b.getAttribute("href") === "#") e.preventDefault();
  if (b.dataset.act === "verifPublico") e.preventDefault();
  const fn = ACT[b.dataset.act]; if (fn && !b.disabled) fn(b.dataset, b);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const fn = FORM[f.dataset.form]; if (fn) fn(f);
});
let tIn;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.in){ clearTimeout(tIn); const k = t.dataset.in, v = t.value, id = t.id; tIn = setTimeout(() => { UI.filtros[k] = v; render(); const el = $("#" + id); if (el){ el.focus(); el.setSelectionRange(v.length, v.length); } }, 220); }
  if (t.dataset.item !== undefined && t.dataset.k === "cantidad"){ UI.draft.items[+t.dataset.item].cantidad = t.value; clearTimeout(tIn); const id = t.id; tIn = setTimeout(() => { const pos = t.selectionStart; render(); const el = $("#" + id); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} } }, 350); }
  if (t.dataset.draft === "obs") UI.draft.obs = t.value;
  if (t.dataset.buscar === "cliente"){
    const d = UI.draft; d.cliTxt = t.value; const c = clientePorEtiqueta(t.value);
    if (c){ const ci = ciudad(c.ciudadId); Object.assign(d, { clienteId:c.id, ciudadId:c.ciudadId, estadoId:ci.estadoId, paisId:byId(DB.estados, ci.estadoId).paisId }); if (d.errores) delete d.errores.clienteId; render(); $("#it-p-0")?.focus(); }
    else if (d.clienteId) d.clienteId = "";
  }
  if (t.dataset.buscar === "producto"){
    const i = +t.dataset.item, it = UI.draft.items[i]; it.txt = t.value; const p = productoPorEtiqueta(t.value);
    if (p){ it.productoId = p.id; render(); const q = $("#it-q-" + i); if (q){ q.focus(); q.select(); } }
    else if (it.productoId) it.productoId = "";
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.switchUser !== undefined){ ACT.demoPaso({ u:t.value, r:ruta() }); return; }
  if (t.dataset.ch){ UI.filtros[t.dataset.ch] = t.value; render(); $("#" + t.id)?.focus(); }
  if (t.dataset.pref){ setPref(t.dataset.pref, t.checked); render(); $("#" + t.id)?.focus(); }
  if (t.dataset.draft && t.dataset.draft !== "obs"){
    const d = UI.draft; d[t.dataset.draft] = t.value;
    if (t.dataset.draft === "paisId"){ d.estadoId = DB.estados.find(x => x.paisId === t.value)?.id || ""; d.ciudadId = ""; }
    if (t.dataset.draft === "estadoId") d.ciudadId = "";
    if (t.dataset.draft === "clienteId" && t.value){ const c = cli(t.value); const ci = ciudad(c.ciudadId); d.ciudadId = c.ciudadId; d.estadoId = ci.estadoId; d.paisId = byId(DB.estados, ci.estadoId).paisId; }
    if (d.errores) delete d.errores[t.dataset.draft];
    render(); $("#" + t.id)?.focus();
  }
  if (t.dataset.item !== undefined && t.dataset.k === "productoId"){ UI.draft.items[+t.dataset.item].productoId = t.value; render(); $("#" + t.id)?.focus(); }
  if (t.dataset.perm){
    const r = t.dataset.rol, k = t.dataset.perm, arr = DB.roles[r];
    if (t.checked){ if (!arr.includes(k)) arr.push(k); } else DB.roles[r] = arr.filter(x => x !== k);
    audit(t.checked ? "Otorgar permiso" : "Revocar permiso", "Rol", r, PERMISOS[k]); save(); toast(`${r}: ${t.checked ? "puede" : "ya no puede"} ${PERMISOS[k].toLowerCase()}.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (UI.a11yOpen){ UI.a11yOpen = false; render(); } else if (UI.menuOpen){ UI.menuOpen = false; render(); } } });
window.addEventListener("hashchange", () => { UI.menuOpen = false; if (ruta() !== "factura-nueva" && ruta() !== "pedido-nuevo") UI.draft = null; render(); window.scrollTo(0, 0); $("#main")?.focus({ preventScroll:true }); });
</script>
<script>
"use strict";
/* Motorepuestos del Oriente
   Arranque · Registro de vistas e inicio de la aplicación. */

const VIEWS = { inicio:vInicio, pedidos:vPedidos, "pedido-nuevo":vFacturaNueva, notificaciones:vNotificaciones, facturas:vFacturas, "factura-nueva":vFacturaNueva, autorizaciones:vAutorizaciones, despachos:vDespachos, inventario:vInventario, importaciones:vImportaciones, clientes:vClientes, trazabilidad:vTrazabilidad, certificados:vCertificados, administracion:vAdministracion };
const AFTER = {};

/* ---------- Arranque ---------- */
load(); loadPrefs();
const ses = store.get(SES_KEY); if (ses){ const u = usr(ses); if (u && u.activo) ME = u; }
if (!ME && ruta() === "certificados") UI.publico = true;
render();
