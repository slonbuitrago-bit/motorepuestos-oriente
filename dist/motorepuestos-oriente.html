<style>
/* Motorepuestos del Oriente — hoja de estilos
   Tokens de diseño (colores, tipografía), temas claro/oscuro y modos de accesibilidad. */
/* Layout: "taller-ledger" app shell — graphite tool rail on the left, cool steel work surface, petrol accent; brand orange only on the mark */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E7ECF0; --ink:#14202A; --muted:#51606C; --line:#D0D8DF;
  --accent:#0A6A75; --accent-ink:#FFFFFF; --accent-soft:#D5EBED;
  --brand:#D9581A;
  --ok:#1B7637; --ok-soft:#DCF0E2; --warn:#8F5300; --warn-soft:#F9EACF; --bad:#B42318; --bad-soft:#FADFDB; --info:#2C5AAE; --info-soft:#DEE7F7;
  --rail:#131D26; --rail-ink:#C3CFD9; --rail-hi:#FFFFFF; --rail-line:#25323E; --rail-act:#1E2D3A;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --scale:1; --lh:1.5; --ls:0em; --ws:0em; --bw:1px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E5ECF1; --muted:#9BABB8; --line:#2A3946;
  --accent:#4EC1CC; --accent-ink:#04232A; --accent-soft:#103A40; --brand:#F07A3C;
  --ok:#62CF86; --ok-soft:#123222; --warn:#F2B552; --warn-soft:#3A2A0E; --bad:#FF8B7C; --bad-soft:#3E1814; --info:#8DB2FF; --info-soft:#18284A;
  --rail:#0A1015; --rail-ink:#AEBBC6; --rail-hi:#FFFFFF; --rail-line:#1C2731; --rail-act:#18242F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E5ECF1; --muted:#9BABB8; --line:#2A3946;
  --accent:#4EC1CC; --accent-ink:#04232A; --accent-soft:#103A40; --brand:#F07A3C;
  --ok:#62CF86; --ok-soft:#123222; --warn:#F2B552; --warn-soft:#3A2A0E; --bad:#FF8B7C; --bad-soft:#3E1814; --info:#8DB2FF; --info-soft:#18284A;
  --rail:#0A1015; --rail-ink:#AEBBC6; --rail-hi:#FFFFFF; --rail-line:#1C2731; --rail-act:#18242F; color-scheme:dark }
/* Accesibilidad: alto contraste, espaciado amplio, subrayado */
:root[data-contrast="alto"]{ --muted:var(--ink); --line:var(--ink); --rail-ink:var(--rail-hi); --bw:2px }
:root[data-espaciado="amplio"]{ --lh:1.8; --ls:.03em; --ws:.12em }
html{ font-size:calc(16px * var(--scale)) }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:1rem; line-height:var(--lh); letter-spacing:var(--ls); word-spacing:var(--ws) }
:root[data-subrayar="si"] a, :root[data-subrayar="si"] .linklike{ text-decoration:underline!important; text-underline-offset:3px }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; scroll-behavior:auto!important } }
:root[data-movimiento="reducido"] *{ animation:none!important; transition:none!important }
*{ box-sizing:border-box }
h1,h2,h3{ font-family:var(--f-display); letter-spacing:.01em; text-wrap:balance; margin:0; line-height:1.15 }
h1{ font-size:2rem; font-weight:700 }
h2{ font-size:1.4rem; font-weight:600 }
h3{ font-size:1.1rem; font-weight:600 }
p{ margin:0 }
a{ color:var(--accent) }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:3px }
.mono{ font-family:var(--f-mono); font-size:.86em; letter-spacing:0 }
.num{ font-variant-numeric:tabular-nums }
.muted{ color:var(--muted) }
.eyebrow{ font-size:.75rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700 }
.sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.skip{ position:fixed; left:max(12px, env(safe-area-inset-left,0px)); top:calc(env(safe-area-inset-top,0px) - 60px); z-index:100; background:var(--accent); color:var(--accent-ink); padding:10px 14px; border-radius:6px; font-weight:700; text-decoration:none }
.skip:focus{ top:calc(env(safe-area-inset-top,0px) + 10px) }

/* Shell */
.shell{ display:grid; grid-template-columns:minmax(248px, 15.5rem) minmax(0,1fr); min-height:100vh }
.rail{ background:var(--rail); color:var(--rail-ink); padding-block:18px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:18px; padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:14px }
.brand{ display:flex; align-items:center; gap:10px; color:var(--rail-hi); padding:0 6px }
.mark{ width:48px; height:48px; flex:none; border-radius:10px; object-fit:cover; background:#000; box-shadow:0 0 0 1px var(--rail-line) }
.logo-hero{ width:clamp(150px, 22vw, 240px); height:auto; aspect-ratio:1; border-radius:18px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.45) }
.brand b{ font-family:var(--f-display); font-size:1.2rem; line-height:1.05; display:block; font-weight:700 }
.brand small{ font-size:.72rem; color:var(--rail-ink); letter-spacing:.06em; text-transform:uppercase }
.nav{ display:flex; flex-direction:column; gap:2px }
.nav .grp{ font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--rail-ink); padding:12px 10px 4px }
.nav a{ display:flex; align-items:center; gap:10px; color:var(--rail-ink); text-decoration:none; padding:8px 10px; border-radius:6px; font-size:.95rem }
.nav a svg{ width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8 }
.nav a:hover{ background:var(--rail-act); color:var(--rail-hi) }
.nav a[aria-current="page"]{ background:var(--rail-act); color:var(--rail-hi); box-shadow:inset 3px 0 0 var(--brand) }
.nav .count{ margin-left:auto; background:var(--brand); color:#fff; font-size:.72rem; font-weight:700; border-radius:10px; padding:1px 7px }
.rail .me{ margin-top:auto; border-top:1px solid var(--rail-line); padding:14px 6px 0; font-size:.88rem }
.rail .me b{ color:var(--rail-hi); display:block }
.main{ min-width:0; display:flex; flex-direction:column; position:relative }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:var(--bw) solid var(--line); display:flex; align-items:center; gap:10px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg) }
.topbar .crumb{ font-family:var(--f-display); font-size:1.15rem; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.topbar .sp{ flex:1 }
.menu-btn{ display:none }
@media (max-width: 520px){ .topbar .lbl{ display:none } .topbar .btn{ padding:8px 10px } .topbar{ gap:6px } }
#main{ padding-block:22px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); max-width:1320px; width:100%; display:flex; flex-direction:column; gap:22px }
#main:focus{ outline:none }
@media (max-width: 900px){
  .shell{ grid-template-columns:minmax(0,1fr) }
  .rail{ position:fixed; inset:0 auto 0 0; width:min(86vw,300px); z-index:50; transform:translateX(-102%); transition:transform .2s ease; padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)) }
  .rail.open{ transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.45) }
  .menu-btn{ display:inline-flex }
  h1{ font-size:1.7rem }
}

/* Controls */
.btn{ font:inherit; font-weight:700; font-size:.92rem; letter-spacing:normal; border-radius:6px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:40px; text-decoration:none; line-height:1.2 }
.btn:hover{ border-color:var(--accent) }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn.primary:hover{ filter:brightness(1.08) }
.btn.danger{ color:var(--bad); border-color:var(--bad) }
.btn.ghost{ background:transparent; border-color:transparent }
.btn.ghost:hover{ background:var(--surface-2) }
.btn.sm{ min-height:32px; padding:5px 10px; font-size:.85rem }
.btn[disabled]{ opacity:.5; cursor:not-allowed }
.btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2 }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center }
.between{ justify-content:space-between }
label{ font-weight:700; font-size:.88rem; display:block }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0 }
.field .hint{ font-size:.8rem; color:var(--muted); font-weight:400 }
input,select,textarea{ font:inherit; font-size:.95rem; letter-spacing:normal; color:var(--ink); background:var(--surface); border:var(--bw) solid var(--line); border-radius:6px; padding:8px 10px; min-height:40px; width:100%; min-width:0 }
input:focus,select:focus,textarea:focus{ border-color:var(--accent); outline:2px solid var(--accent-soft); outline-offset:0 }
input[aria-invalid="true"],select[aria-invalid="true"]{ border-color:var(--bad) }
textarea{ min-height:80px; resize:vertical }
.grid{ display:grid; gap:14px }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)) }
@media (max-width: 760px){ .g2,.g3,.g4{ grid-template-columns:minmax(0,1fr) } }
@media (min-width: 761px) and (max-width: 1100px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)) } .g3{ grid-template-columns:repeat(2,minmax(0,1fr)) } }

.panel{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0 }
.panel > header{ display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between }
.page-head{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between }
.page-head p{ color:var(--muted); max-width:65ch; margin-top:4px }

/* KPI strip */
.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:8px }
.kpi{ padding:14px 16px; border-left:var(--bw) solid var(--line); display:flex; flex-direction:column; gap:2px; min-width:0 }
.kpi:first-child{ border-left:0 }
.kpi .v{ font-family:var(--f-display); font-size:1.9rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1 }
.kpi .l{ font-size:.82rem; color:var(--muted) }
.kpi .d{ font-size:.78rem }
@media (max-width: 1100px){ .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)) } .kpi{ border-left:0; border-top:var(--bw) solid var(--line) } .kpi:nth-child(-n+2){ border-top:0 } .kpi:nth-child(even){ border-left:var(--bw) solid var(--line) } }

/* Tables */
.tw{ position:relative; overflow-x:auto; border:var(--bw) solid var(--line); border-radius:8px; background:var(--surface) }
table{ border-collapse:collapse; width:100%; font-size:.92rem }
th,td{ text-align:left; padding:9px 12px; border-bottom:var(--bw) solid var(--line); vertical-align:middle; white-space:nowrap }
td.wrap{ white-space:normal; min-width:200px }
th{ font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); background:var(--surface-2); position:sticky; top:0 }
tbody tr:last-child td{ border-bottom:0 }
tbody tr:hover{ background:var(--surface-2) }
td.r, th.r{ text-align:right; font-variant-numeric:tabular-nums }
.linklike{ background:none; border:0; padding:0; font:inherit; color:var(--accent); cursor:pointer; font-weight:700; text-align:left }
.empty{ padding:28px; text-align:center; color:var(--muted) }

/* Pills */
.pill{ display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink); white-space:nowrap }
.pill::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.9 }
.pill.ok{ background:var(--ok-soft); color:var(--ok) }
.pill.warn{ background:var(--warn-soft); color:var(--warn) }
.pill.bad{ background:var(--bad-soft); color:var(--bad) }
.pill.info{ background:var(--info-soft); color:var(--info) }
.pill.acc{ background:var(--accent-soft); color:var(--accent) }

.note{ border-radius:8px; padding:12px 14px; background:var(--info-soft); color:var(--ink); border-left:4px solid var(--info); font-size:.92rem }
.note.bad{ background:var(--bad-soft); border-color:var(--bad) }
.note.ok{ background:var(--ok-soft); border-color:var(--ok) }
.note.warn{ background:var(--warn-soft); border-color:var(--warn) }

/* Charts */
.chart svg{ width:100%; height:auto; display:block }
.chart text{ fill:var(--muted); font-family:var(--f-body); font-size:12px }
.hbars{ display:flex; flex-direction:column; gap:8px }
.hbar{ display:grid; grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:.88rem }
.hbar .track{ height:12px; background:var(--surface-2); border-radius:3px; overflow:hidden }
.hbar .fill{ height:100%; background:var(--accent); border-radius:3px }
.meter{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; min-width:80px }
.meter > span{ display:block; height:100%; background:var(--ok) }
.meter.warn > span{ background:var(--warn) } .meter.bad > span{ background:var(--bad) }

/* Tabs */
.tabs{ display:flex; gap:4px; border-bottom:var(--bw) solid var(--line); overflow-x:auto }
.tabs button{ font:inherit; font-weight:700; background:none; border:0; border-bottom:3px solid transparent; padding:10px 12px; color:var(--muted); cursor:pointer; white-space:nowrap }
.tabs button[aria-selected="true"]{ color:var(--ink); border-color:var(--accent) }

/* Timeline */
.tl{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.tl li{ display:grid; grid-template-columns:16px minmax(0,1fr); gap:12px; padding-bottom:14px; position:relative }
.tl li::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-top:6px; margin-left:3px }
.tl li::after{ content:""; position:absolute; left:7px; top:18px; bottom:0; width:2px; background:var(--line) }
.tl li:last-child::after{ display:none }
.tl .when{ font-size:.8rem; color:var(--muted) }

/* Dialog */
dialog{ border:var(--bw) solid var(--line); border-radius:10px; padding:0; background:var(--surface); color:var(--ink); width:min(860px, calc(100vw - 24px)); max-height:calc(100vh - 32px) }
dialog::backdrop{ background:rgba(8,14,20,.55) }
.dlg-head{ display:flex; gap:10px; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:var(--bw) solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2 }
.dlg-body{ padding:18px; display:flex; flex-direction:column; gap:16px }
.dlg-foot{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:var(--bw) solid var(--line); position:sticky; bottom:0; background:var(--surface) }

/* Invoice document */
.doc{ border:var(--bw) solid var(--line); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:14px; background:var(--surface) }
.doc .hd{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px }
.kv{ display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 14px; font-size:.9rem }
.kv dt{ color:var(--muted) } .kv dd{ margin:0; min-width:0; overflow-wrap:anywhere }
.totals{ margin-left:auto; min-width:min(280px,100%) }
.totals div{ display:flex; justify-content:space-between; gap:20px; padding:3px 0; font-variant-numeric:tabular-nums }
.totals .grand{ border-top:var(--bw) solid var(--ink); font-weight:700; font-size:1.1rem; padding-top:6px }
.hash{ font-family:var(--f-mono); font-size:.75rem; overflow-wrap:anywhere; color:var(--muted) }

/* Toasts */
#toasts{ position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:200; display:flex; flex-direction:column; gap:8px; max-width:min(420px, calc(100vw - 32px)) }
.toast{ background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:8px; font-size:.92rem; box-shadow:0 6px 24px rgba(0,0,0,.25); animation:tin .2s ease }
.toast.bad{ background:var(--bad); color:#fff }
@keyframes tin{ from{ transform:translateY(8px); opacity:.4 } }

/* A11y panel */
.a11y{ position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:56px; z-index:40; width:min(400px, calc(100vw - 32px)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.2); padding:16px; display:flex; flex-direction:column; gap:12px }
.switch{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 10px; font-weight:400 }
.switch input{ width:auto; min-height:0; accent-color:var(--accent); width:20px; height:20px }
.seg{ display:inline-flex; border:var(--bw) solid var(--line); border-radius:6px; overflow:hidden }
.seg button{ font:inherit; border:0; background:var(--surface); color:var(--ink); padding:6px 12px; cursor:pointer; min-width:44px; font-weight:700 }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink) }

/* Login */
.login{ min-height:100vh; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) }
.login .side{ background:var(--rail); color:var(--rail-ink); padding-block:48px; padding-left:max(28px, env(safe-area-inset-left,0px)); padding-right:28px; display:flex; flex-direction:column; gap:22px; justify-content:center }
.login .side h1{ color:var(--rail-hi); font-size:clamp(2.2rem, 5vw, 3.6rem); line-height:1 }
.login .side p{ max-width:52ch }
.login .facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; max-width:560px }
.login .facts div{ border-top:2px solid var(--brand); padding-top:8px; font-size:.85rem }
.login .facts b{ display:block; color:var(--rail-hi); font-family:var(--f-display); font-size:1.5rem }
.login .form{ padding-block:40px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:16px; justify-content:center; max-width:560px }
.users{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.ucard{ text-align:left; font:inherit; background:var(--surface); color:var(--ink); border:var(--bw) solid var(--line); border-radius:8px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:2px }
.ucard:hover{ border-color:var(--accent) }
.ucard[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) }
.ucard small{ color:var(--muted) }
@media (max-width: 860px){ .login{ grid-template-columns:minmax(0,1fr) } .login .side{ padding-block:32px } .login .facts{ grid-template-columns:repeat(3,minmax(0,1fr)) } .users{ grid-template-columns:minmax(0,1fr) } }

.items-table input, .items-table select{ min-height:36px; padding:6px 8px }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px }
.task{ display:flex; gap:12px; align-items:center; padding:12px 14px; border:var(--bw) solid var(--line); border-radius:8px; background:var(--surface) }
.task .n{ font-family:var(--f-display); font-size:1.8rem; font-weight:700; min-width:2ch; text-align:center; color:var(--accent) }
.task div{ flex:1; min-width:0 }
.chk{ display:flex; align-items:flex-start; gap:10px; font-weight:400 }
.chk input{ width:20px; height:20px; min-height:0; flex:none; margin-top:2px; accent-color:var(--accent) }
.matrix td{ text-align:center } .matrix td:first-child, .matrix th:first-child{ text-align:left }
.matrix input{ width:20px; height:20px; min-height:0; accent-color:var(--accent) }

/* Motorepuestos del Oriente
   Capa de datos · Estado global, consecutivos, bitácora encadenada (SHA-256), CUFE y códigos de certificado. */

/* ---------- Datos ---------- */
let DB = null, ME = null, PREFS = {};
const UI = { tab:{}, filtros:{}, draft:null, a11yOpen:false, menuOpen:false };

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function nextNum(key){ DB.seq[key] = (DB.seq[key] || 0) + 1; return DB.seq[key]; }
function canonAudit(e){ return [e.seq, e.ts, e.usuario, e.rol, e.accion, e.entidad, e.ref, e.detalle].join("|"); }
function audit(accion, entidad, ref, detalle, opt = {}){
  const u = opt.user || ME;
  const prev = DB.audit.length ? DB.audit[DB.audit.length - 1].hash : "0".repeat(64);
  const e = { seq: DB.audit.length + 1, ts: opt.at || new Date().toISOString(), usuario: u ? u.nombre : "Sistema", rol: u ? u.rol : "Sistema", accion, entidad, ref: ref || "", detalle: detalle || "" };
  e.prev = prev; e.hash = sha(prev + "|" + canonAudit(e));
  DB.audit.push(e);
}
function verificarCadena(){
  let prev = "0".repeat(64);
  for (const e of DB.audit){
    if (e.prev !== prev || sha(prev + "|" + canonAudit(e)) !== e.hash) return { ok:false, seq:e.seq };
    prev = e.hash;
  }
  return { ok:true, n: DB.audit.length };
}
function cufe(f){
  const cli = byId(DB.clientes, f.clienteId);
  return sha([f.numero, f.fecha, f.subtotal.toFixed(2), "01", f.iva.toFixed(2), f.total.toFixed(2), DB.empresa.nit, cli ? cli.nit : "", "2-pruebas"].join("|"));
}
function certCode(f, it, i){ const h = sha(f.numero + "|" + it.productoId + "|" + i + "|" + f.cufe).toUpperCase(); return "CG-" + h.slice(0,4) + "-" + h.slice(4,8); }

      const ageDays = (now - d) / DAY;
      const desdePedido = ageDays >= 1.2 && R() < .6;
      let ped = null;
      if (desdePedido){
        const dp = new Date(+d - ri(1, 3) * 36e5);
        ped = buildPedido(db, cli.id, suc, cli.ciudadId, items.map(x => ({ ...x })), dp.toISOString(), creador);
        ev(dp, "Registrar pedido de venta", "Pedido", ped.numero, cli.nombre + " · " + money(ped.total), creador);

      }
      const f = buildFactura(db, cli.id, suc, cli.ciudadId, items, d.toISOString(), creador, ped);
      ev(d, desdePedido ? "Facturar pedido de venta" : "Registrar factura manual", "Factura", f.numero, (ped ? "Pedido " + ped.numero + " · " : cli.nombre + " · ") + money(f.total), creador);
      ev(new Date(+d + 2000), "Validar cupo del cliente", "Factura", f.numero, "Cupo suficiente", creador);
      let fate;
      if (ageDays < 1.2) fate = "Pendiente";
      else if (ageDays < 3) fate = R() < .5 ? "Autorizada" : "Alistamiento";
      else if (ageDays < 6) fate = R() < .6 ? "En tránsito" : "Entregada";
      else fate = R() < .04 && !desdePedido ? "Rechazada" : (R() < .08 ? "Con novedad" : "Entregada");
      if (fate === "Pendiente") continue;
      const ta = desdePedido ? new Date(+d + 60000) : new Date(+d + ri(1, 6) * 36e5);
      if (fate === "Rechazada"){
        f.estado = "Rechazada"; f.motivoRechazo = "Cantidades no coinciden con lo que el cliente pidió por teléfono."; f.revisadoPor = "U2"; f.revisadoEn = ta.toISOString();
        ev(ta, "Rechazar factura manual", "Factura", f.numero, f.motivoRechazo, "U2"); continue;
      }
      if (desdePedido){
        autorizarFactura(db, f, "SYS", ta.toISOString());
        ev(ta, "Contabilizar factura (automática, origen pedido)", "Factura", f.numero, "Asiento " + f.asiento.numero + " · CUFE " + f.cufe.slice(0,16) + "…", null);
      } else {
        autorizarFactura(db, f, "U2", ta.toISOString());
        ev(ta, "Autorizar factura manual", "Factura", f.numero, "CUFE " + f.cufe.slice(0,16) + "…", "U2");
        ev(new Date(+ta + 1000), "Contabilizar factura autorizada", "Factura", f.numero, "Asiento " + f.asiento.numero, "U2");
      }
      correo(db, "Factura emitida", f, new Date(+ta + 2000).toISOString());
      if (ageDays > 40){ f.pagada = true; f.pagoEn = new Date(+d + ri(15, 35) * DAY).toISOString(); ev(new Date(f.pagoEn), "Registrar pago de factura", "Factura", f.numero, money(f.total), "U2"); correo(db, "Pago registrado", f, f.pagoEn); }
      if (fate === "Autorizada") continue;
      const tr = new Date(+ta + ri(2, 8) * 36e5);
      const rem = buildRemision(db, f, tr.toISOString(), {
        direccion: cli.direccion, referencia:"Local comercial, frente a la vía principal", contacto: cli.contacto, telefono: cli.telefono,
        transportadora: suc === "S1" && R() < .5 ? "Flota propia" : pick(db.transportadoras), guia: "GU" + ri(100000, 999999), franja:"8:00 a. m. – 12:00 m.", observaciones:"Entregar únicamente a la persona de contacto. Exigir firma y cédula."
      });
      ev(tr, "Registrar despacho", "Remisión", rem.numero, "Factura " + f.numero, "U4");
      ev(new Date(+tr + 500), "Registrar instrucciones de envío", "Remisión", rem.numero, rem.instrucciones.transportadora + " · guía " + rem.instrucciones.guia, "U4");
      if (fate === "Alistamiento") continue;
      const tv = new Date(+tr + ri(1, 3) * 36e5);
      const tAl = new Date(+tv - ri(15, 50) * 6e4); rem.alistadoPor = "U5"; rem.alistadoEn = tAl.toISOString();
      ev(tAl, "Alistar pedido en bodega", "Remisión", rem.numero, "Listo para el conteo ciego de Despachos", "U5");
      rem.items.forEach(it => it.contado = it.cantidad);
      rem.estado = "Verificada"; rem.verificadaEn = tv.toISOString(); rem.sello = sha(rem.numero + tv.toISOString()).slice(0, 10).toUpperCase();
      ev(tv, "Verificar alistamiento (conteo ciego)", "Remisión", rem.numero, "Conteo conforme · sello " + rem.sello, "U4");
      const tt = new Date(+tv + 36e5);

      if (fate === "Con novedad"){

        rem.estado = "Con novedad";
        const nov = { id:"N" + nextNumDb(db, "NOV"), tipo:"Entrega", remisionId:rem.id, facturaId:f.id, fecha:te.toISOString(), usuario:"Julián Zuluaga", detalle: difDetalle(db, rem.items, "recibido"), estado: ageDays > 25 ? "Cerrada" : "Abierta", resolucion: ageDays > 25 ? "Transportadora reconoce faltante; se envió reposición sin costo." : "" };
        db.novedades.push(nov);

      }
    }
  }
  /* ---------- Escenario de demostración ----------
     Garantiza que cada estado del flujo tenga ejemplos el día de la demo.
     Se crea en orden cronológico para que los consecutivos sigan en orden. */
  const H = h => new Date(+now - h * 36e5);
  const lineas = its => its.map(([pid, q]) => ({ productoId:pid, cantidad:q, precio:db.productos.find(p => p.id === pid).precio }));
  const C = id => db.clientes.find(x => x.id === id);
  const mkPed = (cid, its, h, creador = "U3") => {

  const mkFac = (cid, sucId, its, h, creador, ped) => {

    const f = buildFactura(db, cid, sucId, c.ciudadId, ped ? ped.items.map(x => ({ ...x })) : lineas(its), d.toISOString(), creador, ped);
    ev(d, ped ? "Facturar pedido de venta" : "Registrar factura manual", "Factura", f.numero, (ped ? "Pedido " + ped.numero + " · " : c.nombre + " · ") + money(f.total), creador);
    ev(new Date(+d + 2000), "Validar cupo del cliente", "Factura", f.numero, "Cupo suficiente", creador);

  };
  const autorizar = (f, h) => {
    const t = H(h).toISOString();
    if (f.origen === "Pedido"){ autorizarFactura(db, f, "SYS", t); ev(new Date(t), "Contabilizar factura (automática, origen pedido)", "Factura", f.numero, "Asiento " + f.asiento.numero + " · CUFE " + f.cufe.slice(0,16) + "…", null); }
    else { autorizarFactura(db, f, "U2", t); ev(new Date(t), "Autorizar factura manual", "Factura", f.numero, "CUFE " + f.cufe.slice(0,16) + "…", "U2"); ev(new Date(+new Date(t) + 1000), "Contabilizar factura autorizada", "Factura", f.numero, "Asiento " + f.asiento.numero, "U2"); }
    correo(db, "Factura emitida", f, new Date(+new Date(t) + 2000).toISOString());
  };
  const remision = (f, h, transp, guia) => {
    const c = C(f.clienteId), t = H(h);
    const r = buildRemision(db, f, t.toISOString(), { direccion:c.direccion, referencia:"Local comercial, frente a la vía principal", contacto:c.contacto, telefono:c.telefono, transportadora:transp, guia, franja:"8:00 a. m. – 12:00 m.", observaciones:"Entregar únicamente a la persona de contacto. Exigir firma y cédula." });
    ev(t, "Registrar despacho", "Remisión", r.numero, "Factura " + f.numero, "U4");

  };
  const alistar = (r, h) => { const t = H(h); r.alistadoPor = "U5"; r.alistadoEn = t.toISOString(); ev(t, "Alistar pedido en bodega", "Remisión", r.numero, "Listo para el conteo ciego de Despachos", "U5"); };
  const verificar = (r, h) => { const t = H(h); r.items.forEach(it => it.contado = it.cantidad); r.estado = "Verificada"; r.verificadaEn = t.toISOString(); r.sello = sha(r.numero + r.verificadaEn).slice(0, 10).toUpperCase(); ev(t, "Verificar alistamiento (conteo ciego)", "Remisión", r.numero, "Conteo conforme · sello " + r.sello, "U4"); };
  const transito = (r, h) => { const t = H(h); r.estado = "En tránsito"; r.salidaEn = t.toISOString(); ev(t, "Despachar remisión", "Remisión", r.numero, "Salida de bodega", "U4"); correo(db, "Despacho", r, t.toISOString()); };

  // 1. Pedido registrado temprano (queda por facturar)
  mkPed("C1", [["PR2",10],["PR11",20]], 4.95);
  // 2. Facturas autorizadas que esperan remisión
  const fA = mkFac("C2", "S1", [["PR15",2],["PR6",10]], 4.9, "U3"); autorizar(fA, 4.85);
  const pB = mkPed("C5", [["PR10",30],["PR18",4]], 4.88); const fB = mkFac("C5", "S1", null, 4.8, "U3", pB); autorizar(fB, 4.8);
  // 3. Remisión verificada (sellada), con un primer conteo errado que abrió una novedad
  const fC = mkFac("C7", "S1", [["PR3",10],["PR17",6]], 4.75, "U3"); autorizar(fC, 4.7);
  const rC = remision(fC, 4.6, "Coordinadora", "CO458812"); alistar(rC, 4.55);
  const tNov = H(4.5);
  rC.items[0].contado = 11;
  const novC = { id:"N" + nextNumDb(db, "NOV"), tipo:"Alistamiento", remisionId:rC.id, facturaId:fC.id, fecha:tNov.toISOString(), usuario:"Julián Zuluaga", detalle:difDetalle(db, rC.items, "contado") + " · Alistó: Diana Marín · Contó: Julián Zuluaga", estado:"Abierta", resolucion:"" };
  db.novedades.push(novC); ev(tNov, "Discrepancia en conteo de alistamiento", "Remisión", rC.numero, novC.detalle, "U4");
  alistar(rC, 4.45); verificar(rC, 4.4);
  // 4. Dos remisiones en tránsito
  const pD = mkPed("C9", [["PR16",5],["PR1",30]], 4.68); const fD = mkFac("C9", "S1", null, 4.6, "U3", pD); autorizar(fD, 4.6);
  const rD = remision(fD, 4.5, "Servientrega", "SV7712045"); alistar(rD, 4.4); verificar(rD, 4.3); transito(rD, 4.1);
  const fE = mkFac("C6", "S1", [["PR19",3],["PR8",12]], 4.45, "U3"); autorizar(fE, 4.35);
  const rE = remision(fE, 4.25, "Flota propia", ""); alistar(rE, 4.2); verificar(rE, 4.15); transito(rE, 4.0);
  // 5. Facturas manuales pendientes de autorización
  mkFac("C4", "S1", [["PR4",4],["PR3",10],["PR1",24]], 3, "U3");
  mkFac("C10", "S1", [["PR20",6],["PR11",20]], 2.2, "U3");
  mkPed("C6", [["PR5",6],["PR8",15]], 2);
  mkFac("C3", "S3", [["PR6",12],["PR12",20]], 1.5, "U7");
  // 6. Pedido recién llegado
  mkPed("C10", [["PR14",8],["PR7",3]], 0.7);
  // 7. Cliente de la demo de cupo (Repuestos San Vicente): el histórico depende de la fecha en que se
  //    cargan los datos, así que su cupo se ajusta para que siempre le queden unos 1,78 millones
  //    disponibles. Así, en la demo, 12 llantas superan el cupo y 2 sí caben, cualquier día.
  const c8 = C("C8");
  const comprometidoC8 = sum(db.facturas.filter(f => f.clienteId === "C8" && !f.pagada && (f.estado === "Pendiente" || f.estado === "Autorizada")), f => f.total)
                       + sum(db.pedidos.filter(x => x.clienteId === "C8" && x.estado === "Registrado"), x => x.total);
  c8.cupo = Math.round((comprometidoC8 + 1780000) / 1e4) * 1e4;
  // Las existencias de la tabla representan el saldo actual después del histórico
  prods.forEach((p, i) => { db.productos[i].stock = { S1:p[7][0], S2:p[7][1], S3:p[7][2] }; });
  events.sort((a, b) => a[0] < b[0] ? -1 : 1);
  const saveDB = DB; DB = db;
  ev(now, "Inicializar datos de demostración", "Sistema", "", "Base de datos de ejemplo creada", "U1");
  events.forEach(e => audit(e[1], e[2], e[3], e[4], { at:e[0], user:e[5] || { nombre:"Sistema", rol:"Sistema" } }));
  db.correos.sort((a, b) => a.ts.localeCompare(b.ts));
  DB = saveDB;

<script>
"use strict";
/* Motorepuestos del Oriente
   Capa de dominio · Reglas de negocio: pedidos, facturas, autorización y contabilización, remisiones, correos, cupo. */

function nextNumDb(db, key){ db.seq[key] = (db.seq[key] || 0) + 1; return db.seq[key]; }
function difDetalle(db, items, campo){
  return items.filter(it => it[campo] !== it.cantidad).map(it => { const p = byId(db.productos, it.productoId); return p.sku + ": facturado " + it.cantidad + ", " + (campo === "recibido" ? "recibido " : "contado ") + it[campo]; }).join("; ");
}
function calcTotales(items){ const subtotal = sum(items, it => it.cantidad * it.precio); const iva = Math.round(subtotal * IVA); return { subtotal, iva, total: subtotal + iva }; }
function buildFactura(db, clienteId, sucursalId, ciudadId, items, fecha, creadorId, ped){
  const n = nextNumDb(db, "FAC");
  const t = calcTotales(items);
  const f = { id:"F" + n, numero:"MRO-" + String(1000 + n).padStart(6, "0"), fecha, clienteId, sucursalId, ciudadDestinoId:ciudadId, items, ...t, estado:"Pendiente", origen: ped ? "Pedido" : "Manual", creadoPor:creadorId, pagada:false };
  if (ped){ f.pedidoId = ped.id; ped.estado = "Facturado"; ped.facturaId = f.id; }
  db.facturas.push(f); return f;
}
function buildPedido(db, clienteId, sucursalId, ciudadId, items, fecha, creadorId){
  const n = nextNumDb(db, "PED");
  const p = { id:"PD" + n, numero:"PED-" + String(n).padStart(5, "0"), fecha, clienteId, sucursalId, ciudadDestinoId:ciudadId, items, ...calcTotales(items), estado:"Registrado", creadoPor:creadorId };
  db.pedidos.push(p); return p;
}
/* Notificaciones por correo electrónico (tarjeta A): pedido, factura, despacho y pago */
function correo(db, tipo, obj, ts){
  const F = id => db.facturas.find(x => x.id === id);
  const f = tipo === "Despacho" ? F(obj.facturaId) : obj;
  const c = db.clientes.find(x => x.id === f.clienteId);
  let ref = obj.numero, asunto = "", cuerpo = "";
  if (tipo === "Pedido de venta"){ asunto = `Recibimos su pedido ${obj.numero}`; cuerpo = `Registramos su pedido ${obj.numero} por ${money(obj.total)} (IVA incluido) con ${obj.items.length} ${obj.items.length === 1 ? "referencia" : "referencias"}.\nLe avisaremos cuando la factura sea emitida y cuando la mercancía salga de bodega.`; }
  if (tipo === "Factura emitida"){ asunto = `Factura electrónica ${obj.numero}`; cuerpo = `Emitimos la factura electrónica ${obj.numero} por ${money(obj.total)}${obj.pedidoId ? " correspondiente a su pedido " + db.pedidos.find(x => x.id === obj.pedidoId).numero : ""}.\nCUFE: ${obj.cufe}\nLos certificados de garantía de los repuestos se verifican en nuestra página con su código.`; }
  if (tipo === "Despacho"){ const I = obj.instrucciones; asunto = `Su mercancía va en camino · ${obj.numero}`; cuerpo = `La remisión ${obj.numero} (factura ${f.numero}) salió de bodega.\nTransportadora: ${I.transportadora}${I.guia ? " · guía " + I.guia : ""}\nEntrega en: ${I.direccion} · franja ${I.franja}\nRecibe: ${I.contacto}\nAl recibir, cuente los repuestos frente al conductor y anote cualquier diferencia en la remisión.`; }
  if (tipo === "Pago registrado"){ asunto = `Confirmación de pago · factura ${obj.numero}`; cuerpo = `Registramos el pago de la factura ${obj.numero} por ${money(obj.total)}. Gracias.\nEl valor quedó liberado en su cupo de crédito.`; }
  db.correos.push({ id:"M" + nextNumDb(db, "MAIL"), ts, tipo, para:c.email || "(sin correo registrado)", contacto:c.contacto, clienteId:c.id, ref, asunto, cuerpo:`Hola, ${c.contacto}.\n\n${cuerpo}\n\nMotorepuestos del Oriente S.A.S. · Rionegro, Antioquia\nMensaje automático, por favor no responda a este correo.`, estado: c.email ? "Enviado" : "Sin destinatario" });
}
function autorizarFactura(db, f, userId, ts){
  f.estado = "Autorizada"; f.revisadoPor = userId; f.revisadoEn = ts;
  f.cufe = cufe.call(null, f, db);
  const costo = sum(f.items, it => it.cantidad * byId(db.productos, it.productoId).costo);
  f.asiento = { numero:"CNT-" + String(nextNumDb(db, "CNT")).padStart(5, "0"), fecha:ts, lineas:[
    { cuenta:"130505", nombre:"Clientes nacionales", debito:f.total, credito:0 },
    { cuenta:"413515", nombre:"Venta de partes, piezas y accesorios", debito:0, credito:f.subtotal },
    { cuenta:"240805", nombre:"IVA generado 19 %", debito:0, credito:f.iva },
    { cuenta:"613515", nombre:"Costo de ventas — repuestos", debito:costo, credito:0 },
    { cuenta:"143501", nombre:"Inventario de mercancías", debito:0, credito:costo }
  ]};
  const u = db.usuarios.find(x => x.id === userId);
  f.items.forEach((it, i) => {
    const p = byId(db.productos, it.productoId);
    p.stock[f.sucursalId] = Math.max(0, (p.stock[f.sucursalId] || 0) - it.cantidad);
    db.kardex.push({ fecha:ts, productoId:it.productoId, sucursalId:f.sucursalId, tipo:"Salida por factura", cantidad:-it.cantidad, ref:f.numero, usuario:u ? u.nombre : "Sistema" });
    if (p.garantiaMeses > 0){
      const vence = new Date(ts); vence.setMonth(vence.getMonth() + p.garantiaMeses);
      db.certificados.push({ codigo:certCode(f, it, i), facturaId:f.id, productoId:p.id, clienteId:f.clienteId, cantidad:it.cantidad, emitido:ts, vence:vence.toISOString() });
    }
  });
}
function buildRemision(db, f, ts, instr){
  const n = nextNumDb(db, "REM");
  const r = { id:"R" + n, numero:"REM-" + String(n).padStart(5, "0"), facturaId:f.id, fecha:ts, estado:"Alistamiento", instrucciones:instr, items:f.items.map(it => ({ productoId:it.productoId, cantidad:it.cantidad, contado:null, recibido:null })) };
  db.remisiones.push(r); f.remisionId = r.id; return r;
}
// cufe needs DB to resolve the client; during seed DB is the seed db
const _cufe = cufe;
cufe = function(f, db){ const prev = DB; if (db) DB = db; const r = _cufe(f); DB = prev; return r; };

/* ---------- Derivados de negocio ---------- */
const P = (perm) => !!ME && (DB.roles[ME.rol] || []).includes(perm);
const prod = id => byId(DB.productos, id);
const cli = id => byId(DB.clientes, id);
const ciudad = id => byId(DB.ciudades, id);
const suc = id => byId(DB.sucursales, id);
const usr = id => byId(DB.usuarios, id);
const rem = id => byId(DB.remisiones, id);
const stockTotal = p => sum(Object.values(p.stock), x => x);
function cupoComprometido(clienteId, excluirId){
  return sum(DB.facturas.filter(f => f.clienteId === clienteId && f.id !== excluirId && !f.pagada && (f.estado === "Pendiente" || f.estado === "Autorizada")), f => f.total)
       + sum(DB.pedidos.filter(p => p.clienteId === clienteId && p.id !== excluirId && p.estado === "Registrado"), p => p.total);
}
const nombreUsr = id => id === "SYS" ? "Sistema (factura de pedido)" : (usr(id)?.nombre || "—");
const origenTxt = f => f.origen === "Pedido" ? "Pedido " + (byId(DB.pedidos, f.pedidoId)?.numero || "") : "Manual";
const cupoDisponible = (c, excl) => c.cupo - cupoComprometido(c.id, excl);
function estadoLogistico(f){
  if (f.estado === "Pendiente") return ["Por autorizar","warn"];
  if (f.estado === "Rechazada") return ["Rechazada","bad"];
  if (!f.remisionId) return ["Sin remisión","info"];
  const r = rem(f.remisionId);
  return [r.estado, { "Alistamiento":"info","Verificada":"acc","En tránsito":"acc","Entregada":"ok","Con novedad":"bad" }[r.estado] || ""];
}
const pillFactura = f => `<span class="pill ${ {Pendiente:"warn",Autorizada:"ok",Rechazada:"bad"}[f.estado] || "" }">${esc(f.estado === "Pendiente" ? "Pendiente de autorización" : f.estado)}</span>`;
const pill = (txt, cls) => `<span class="pill ${cls||""}">${esc(txt)}</span>`;

/* Importaciones: flujo de estados y costo nacionalizado (FOB + flete + seguro + arancel) */
const FLUJO_IMP = ["Orden emitida","En tránsito","En aduana","Nacionalizada","Recibida"];
function costeo(im){
  const fob = sum(im.items, it => it.cantidad * it.fobUSD);
  const cif = fob + im.fleteUSD + im.seguroUSD;
  const cifCOP = cif * im.trm, arancel = cifCOP * im.arancelPct / 100, ivaImp = (cifCOP + arancel) * IVA;
  const costoTotal = cifCOP + arancel; // IVA importación es descontable
  return { fob, cif, cifCOP, arancel, ivaImp, costoTotal, factor: fob ? costoTotal / (fob * im.trm) : 1 };
}

/* Regla B3: un municipio de Colombia solo se registra con su departamento oficial (DIVIPOLA del DANE).
   Si el departamento aún no existe en el catálogo de la empresa, se crea con su código DANE. */
function asegurarDepartamento(db, codigoDane){
  const d = daneDepto(codigoDane); if (!d) throw new Error("Código DANE desconocido: " + codigoDane);
  let e = db.estados.find(x => x.id === d[0]);
  if (!e){ e = { id:d[0], paisId:"CO", nombre:d[1] }; db.estados.push(e); }
  return e;
}

/* Conteo ciego (control antifraude): Bodega alista viendo las cantidades; Despachos verifica contando
   sin conocer la cantidad facturada. Hasta que el conteo quede conforme, a quien verifica se le ocultan
   las cantidades y los valores de esa factura en todas las pantallas. */
const verificaCiego = () => P("despachos.gestionar") && !P("despachos.alistar") && !P("facturas.crear") && !P("facturas.autorizar");
const conteoPendiente = f => { const r = f.remisionId ? rem(f.remisionId) : null; return f.estado !== "Rechazada" && (!r || r.estado === "Alistamiento"); };
const ocultarCantidades = f => verificaCiego() && conteoPendiente(f);
</script>

<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Tablero con indicadores y gráficos. */

/* --- Tablero --- */
function vInicio(){
  const fs = UI.filtros.dashSuc || "";
  const F = DB.facturas.filter(f => !fs || f.sucursalId === fs);
  const aut = F.filter(f => f.estado === "Autorizada");
  const now = new Date();
  const mesAct = aut.filter(f => { const d = new Date(f.fecha); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const mesAnt = aut.filter(f => { const d = new Date(f.fecha); const p = new Date(now.getFullYear(), now.getMonth() - 1, 1); return d.getMonth() === p.getMonth() && d.getFullYear() === p.getFullYear() && d.getDate() <= now.getDate(); });
  const vAct = sum(mesAct, f => f.subtotal), vAnt = sum(mesAnt, f => f.subtotal);
  const delta = vAnt ? (vAct - vAnt) / vAnt * 100 : 0;
  const pend = F.filter(f => f.estado === "Pendiente").length;
  const rems = DB.remisiones.filter(r => { const f = byId(DB.facturas, r.facturaId); return !fs || f.sucursalId === fs; });
  const transito = rems.filter(r => r.estado === "En tránsito").length;
  const cerradas = rems.filter(r => r.estado === "Entregada" || r.estado === "Con novedad");
  const conformes = cerradas.length ? cerradas.filter(r => r.estado === "Entregada").length / cerradas.length * 100 : 100;
  const bajo = DB.productos.filter(p => stockTotal(p) < p.minimo * 1.6);
  const novAb = DB.novedades.filter(n => n.estado === "Abierta").length;

  // ventas por mes (6)
  const meses = [];
  for (let m = 5; m >= 0; m--){ const d = new Date(now.getFullYear(), now.getMonth() - m, 1); meses.push({ y:d.getFullYear(), m:d.getMonth(), label:MESES[d.getMonth()], value:0 }); }
  aut.forEach(f => { const d = new Date(f.fecha); const x = meses.find(z => z.y === d.getFullYear() && z.m === d.getMonth()); if (x) x.value += f.subtotal; });
  // ventas por municipio
  const mun = {};
  aut.forEach(f => { const c = ciudad(f.ciudadDestinoId)?.nombre || "—"; mun[c] = (mun[c] || 0) + f.subtotal; });
  const munArr = Object.entries(mun).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const maxMun = munArr.length ? munArr[0][1] : 1;
  // top productos
  const tp = {};
  aut.forEach(f => f.items.forEach(it => tp[it.productoId] = (tp[it.productoId] || 0) + it.cantidad * it.precio));
  const top = Object.entries(tp).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const totalTop = sum(Object.values(tp), x => x) || 1;

  const tareas = [];
  if (P("facturas.autorizar")) tareas.push([pend, "facturas esperan tu autorización", "Revisa cantidades, cupo y destino antes de autorizar.", "autorizaciones"]);
  if (P("despachos.gestionar")){ tareas.push([DB.facturas.filter(f => f.estado === "Autorizada" && !f.remisionId).length, "facturas autorizadas sin remisión", "Crea la remisión con las instrucciones de envío.", "despachos"]); tareas.push([DB.remisiones.filter(r => r.estado === "Alistamiento" && r.alistadoPor).length, "remisiones alistadas por verificar", "Haz el conteo ciego antes de despachar.", "despachos"]); }
  if (P("despachos.alistar") && !P("despachos.gestionar")) tareas.push([DB.remisiones.filter(r => r.estado === "Alistamiento" && !r.alistadoPor).length, "remisiones por alistar", "Saca los repuestos y márcalas como alistadas para el conteo ciego.", "despachos"]);
  if (P("pedidos.gestionar")) tareas.push([DB.pedidos.filter(p => p.estado === "Registrado").length, "pedidos de venta por facturar", "Al facturarlos quedan contabilizados y se avisa al cliente por correo.", "pedidos"]);
  if (P("facturas.crear")) tareas.push([DB.facturas.filter(f => f.estado === "Rechazada" && f.creadoPor === ME.id).length, "facturas tuyas fueron rechazadas", "Lee el motivo y registra una nueva factura corregida.", "facturas"]);
  if (P("inventario.gestionar")) tareas.push([bajo.length, "referencias bajo el stock mínimo", "Programa traslado o pedido de importación.", "inventario"]);
  if (P("importaciones.gestionar")) tareas.push([DB.importaciones.filter(i => i.estado !== "Recibida").length, "importaciones en curso", "Actualiza el estado y recibe la mercancía al llegar.", "importaciones"]);
  if (P("auditoria.ver")) tareas.push([novAb, "novedades de entrega abiertas", "Diferencias entre lo facturado y lo recibido.", "despachos"]);

  return `
  <div class="page-head"><div><p class="eyebrow">${esc(fdate(now.toISOString()))} · ${esc(ME.rol)}</p><h1>Hola, ${esc(ME.nombre.split(" ")[0])}</h1>
    <p>Resumen de la operación. Las cifras de ventas son valores antes de IVA de facturas autorizadas.</p></div>
    <div class="field" style="min-width:220px"><label for="f-dsuc">Sucursal</label><select id="f-dsuc" data-ch="dashSuc"><option value="">Todas las sucursales</option>${DB.sucursales.map(s => `<option value="${s.id}" ${fs === s.id ? "selected" : ""}>${esc(s.nombre)}</option>`).join("")}</select></div>
  </div>
  ${tareas.length ? `<section aria-labelledby="t-tareas" class="grid" style="gap:10px"><h2 id="t-tareas" class="sr">Tus pendientes</h2><div class="cards">
    ${tareas.map(t => `<div class="task"><span class="n">${t[0]}</span><div><b>${esc(t[1])}</b><br><span class="muted" style="font-size:.85rem">${esc(t[2])}</span></div><a class="btn sm" href="#${t[3]}">Ir</a></div>`).join("")}</div></section>` : ""}
  <section class="kpis" aria-label="Indicadores clave">
    <div class="kpi"><span class="l">Ventas del mes</span><span class="v" title="${money(vAct)}">${short(vAct)}</span><span class="d" style="color:${delta >= 0 ? "var(--ok)" : "var(--bad)"}">${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta).toFixed(1)} % vs. mismo corte mes anterior</span></div>
    <div class="kpi"><span class="l">Por autorizar</span><span class="v">${pend}</span><span class="d muted">facturas manuales</span></div>
    <div class="kpi"><span class="l">En tránsito</span><span class="v">${transito}</span><span class="d muted">remisiones en ruta</span></div>
    <div class="kpi"><span class="l">Entregas conformes</span><span class="v">${conformes.toFixed(1)} %</span><span class="d muted">${cerradas.length} entregas · ${novAb} novedades abiertas</span></div>
    <div class="kpi"><span class="l">Bajo stock mínimo</span><span class="v" style="color:${bajo.length ? "var(--warn)" : "inherit"}">${bajo.length}</span><span class="d muted">referencias</span></div>
  </section>
  <div class="grid g2">
    <section class="panel" aria-labelledby="c1"><header><h2 id="c1">Ventas por mes</h2><span class="muted" style="font-size:.85rem">COP antes de IVA</span></header>
      <div class="chart">${barChart(meses)}</div>
      <table class="sr"><caption>Ventas por mes</caption><tbody>${meses.map(m => `<tr><th>${m.label} ${m.y}</th><td>${money(m.value)}</td></tr>`).join("")}</tbody></table></section>
    <section class="panel" aria-labelledby="c2"><header><h2 id="c2">Ventas por municipio de destino</h2><span class="muted" style="font-size:.85rem">6 meses</span></header>
      <div class="hbars">${munArr.map(([n, v]) => `<div class="hbar"><span>${esc(n)}</span><div class="track" aria-hidden="true"><div class="fill" style="width:${(v / maxMun * 100).toFixed(1)}%"></div></div><span class="num">${money(v)}</span></div>`).join("") || '<p class="empty">Sin ventas</p>'}</div></section>
  </div>
  <div class="grid g2">
    <section class="panel" aria-labelledby="c3"><header><h2 id="c3">Referencias más vendidas</h2></header>
      <div class="tw"><table><thead><tr><th>Referencia</th><th class="r">Ventas</th><th class="r">Participación</th></tr></thead><tbody>
      ${top.map(([id, v]) => `<tr><td><span class="mono">${esc(prod(id).sku)}</span> ${esc(prod(id).nombre)}</td><td class="r">${money(v)}</td><td class="r">${(v / totalTop * 100).toFixed(1)} %</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel" aria-labelledby="c4"><header><h2 id="c4">Actividad reciente</h2><span class="muted" style="font-size:.85rem">Bitácora encadenada</span></header>
      <ul class="tl">${DB.audit.slice(-6).reverse().map(e => `<li><div><b>${esc(e.accion)}</b> <span class="mono">${esc(e.ref)}</span><br><span class="when">${fdt(e.ts)} · ${esc(e.usuario)} (${esc(e.rol)})</span></div></li>`).join("")}</ul></section>
  </div>`;
}
function barChart(data){
  const W = 600, H = 240, pl = 64, pb = 28, pt = 14, pr = 10;
  const max = Math.max(1, ...data.map(d => d.value));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / data.length;
  let g = "";
  for (let v = 0; v <= top; v += step){ const y = pt + ih - v / top * ih; g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${short(v)}</text>`; }
  data.forEach((d, i) => {
    const h = d.value / top * ih, x = pl + i * bw + bw * .2, y = pt + ih - h;
    const last = i === data.length - 1;
    g += `<rect x="${x}" y="${y}" width="${bw * .6}" height="${h}" rx="3" fill="var(--accent)" opacity="${last ? 1 : .55}"/>`;
    g += `<text x="${x + bw * .3}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
    if (last) g += `<text x="${x + bw * .3}" y="${y - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${short(d.value)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras de ventas de los últimos seis meses">${g}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function short(v){ return v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".", ",") + " M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + " mil" : "$" + v; }
</script>

<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Facturas: listado, formulario (pedido o manual), documento y detalle. */

/* --- Buscadores con sugerencias ---
   Campos de texto con lista de sugerencias del navegador (datalist): se escribe parte del
   nombre, la referencia, el NIT, el municipio o la moto, y la lista se filtra sola. */
const etqCliente = c => `${c.nombre} · NIT ${c.nit} · ${ciudad(c.ciudadId)?.nombre || ""}`;
const etqProducto = p => `${p.sku} · ${p.nombre} · ${p.compat}`;
const clientePorEtiqueta = v => DB.clientes.find(c => c.activo && etqCliente(c) === String(v).trim());
const productoPorEtiqueta = v => DB.productos.find(p => p.activo && etqProducto(p) === String(v).trim());
const listaClientes = () => `<datalist id="dl-clientes">${DB.clientes.filter(c => c.activo).map(c => `<option value="${esc(etqCliente(c))}"></option>`).join("")}</datalist>`;
const listaProductos = sucId => `<datalist id="dl-productos">${DB.productos.filter(p => p.activo).map(p => `<option value="${esc(etqProducto(p))}" label="Existencia ${sucId ? (p.stock[sucId] || 0) : stockTotal(p)} · ${money(p.precio)}"></option>`).join("")}</datalist>`;

/* --- Facturas --- */
function vFacturas(){
  const q = (UI.filtros.fq || "").toLowerCase(), fe = UI.filtros.fe || "", fsu = UI.filtros.fsu || "";
  const list = DB.facturas.filter(f => {
    if (fe && f.estado !== fe && estadoLogistico(f)[0] !== fe) return false;
    if (fsu && f.sucursalId !== fsu) return false;
    if (q){ const c = cli(f.clienteId); if (!(f.numero.toLowerCase().includes(q) || c.nombre.toLowerCase().includes(q) || c.nit.includes(q))) return false; }
    return true;
  }).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const shown = list.slice(0, UI.filtros.flim || 40);
  return `
  <div class="page-head"><div><h1>Facturas</h1><p>Las facturas que salen de un pedido de venta quedan contabilizadas de inmediato. Las facturas manuales, sin pedido, requieren autorización de un gerente antes de contabilizarse y despacharse.</p></div>

  <div class="tw"><table><caption class="sr">Listado de facturas</caption><thead><tr><th>Número</th><th>Origen</th><th>Fecha</th><th>Cliente</th><th>Destino</th><th class="r">Total</th><th>Autorización</th><th>Logística</th><th>Cartera</th></tr></thead><tbody>

  </tbody></table></div>

}

function nuevoDraft(modo){ return { modo, clienteId:"", sucursalId: ME.sucursalId || "S1", paisId:"CO", estadoId:"05", ciudadId:"", items:[{ productoId:"", cantidad:1 }], obs:"", errores:{} }; }

  const t = calcTotales(items);

    <a class="btn" href="${volver}" data-act="cancelDraft">Cancelar</a></div>

  <form data-form="factura" class="grid" novalidate>
    <section class="panel" aria-labelledby="s-cli"><header><h2 id="s-cli">1. Cliente y origen</h2></header>
      <div class="grid g2">
        <div class="field"><label for="d-cli">Cliente <span aria-hidden="true">*</span></label>
          <input id="d-cli" type="text" list="dl-clientes" autocomplete="off" data-buscar="cliente" required placeholder="Escribe el nombre, el NIT o el municipio" value="${esc(c ? etqCliente(c) : (d.cliTxt || ""))}" aria-invalid="${!!E.clienteId}" aria-describedby="d-cli-h">${listaClientes()}
          <span class="hint" id="d-cli-h">${E.clienteId ? `<span style="color:var(--bad)">${esc(E.clienteId)}</span>` : c ? `Cupo ${money(c.cupo)} · disponible <b>${money(disp)}</b>` : "Escribe parte del nombre y elige de las sugerencias. Luego verás su cupo."}</span></div>
        <div class="field"><label for="d-suc">Sucursal que factura y despacha</label>
          <select id="d-suc" data-draft="sucursalId">${DB.sucursales.map(s => `<option value="${s.id}" ${d.sucursalId === s.id ? "selected" : ""}>${esc(s.nombre)}</option>`).join("")}</select></div>
      </div>
      ${c ? `<div><div class="row between" style="font-size:.85rem"><span>Uso del cupo con esta factura</span><span class="num">${money(c.cupo - disp + t.total)} de ${money(c.cupo)}</span></div>
        <div class="meter ${!cupoOk ? "bad" : (c.cupo - disp + t.total) / c.cupo > .8 ? "warn" : ""}" role="meter" aria-valuemin="0" aria-valuemax="${c.cupo}" aria-valuenow="${c.cupo - disp + t.total}" aria-label="Uso del cupo"><span style="width:${Math.min(100, (c.cupo - disp + t.total) / c.cupo * 100)}%"></span></div></div>` : ""}
    </section>
    <section class="panel" aria-labelledby="s-dest"><header><h2 id="s-dest">2. Destino del envío</h2><span class="muted" style="font-size:.85rem">Solo municipios registrados</span></header>
      <div class="grid g3">
        <div class="field"><label for="d-pais">País</label><select id="d-pais" data-draft="paisId">${DB.paises.map(p => `<option value="${p.id}" ${d.paisId === p.id ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select></div>
        <div class="field"><label for="d-est">Departamento / estado</label><select id="d-est" data-draft="estadoId">${DB.estados.filter(e => e.paisId === d.paisId).sort(porNombre).map(e => `<option value="${e.id}" ${d.estadoId === e.id ? "selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></div>
        <div class="field"><label for="d-ciu">Ciudad o municipio <span aria-hidden="true">*</span></label><select id="d-ciu" data-draft="ciudadId" aria-invalid="${!!E.ciudadId}" aria-describedby="d-ciu-h"><option value="">Selecciona</option>${DB.ciudades.filter(x => x.estadoId === d.estadoId).sort(porNombre).map(x => `<option value="${x.id}" ${d.ciudadId === x.id ? "selected" : ""}>${esc(x.nombre)} · ${esc(x.id)}</option>`).join("")}</select>

    <section class="panel" aria-labelledby="s-it"><header><h2 id="s-it">3. Repuestos</h2><button type="button" class="btn sm" data-act="addItem">${icon("plus")} Agregar línea</button></header>
      ${E.items ? `<div class="note bad" role="alert">${esc(E.items)}</div>` : ""}
      <div class="tw"><table class="items-table"><thead><tr><th>Referencia</th><th class="r">Existencia</th><th class="r" style="width:110px">Cantidad</th><th class="r">Precio unit.</th><th class="r">Subtotal</th><th><span class="sr">Quitar</span></th></tr></thead><tbody>

  </form>`;
}

function vDocFactura(f){
  const c = cli(f.clienteId), s = suc(f.sucursalId), ci = ciudad(f.ciudadDestinoId), oc = ocultarCantidades(f), x = v => oc ? "—" : v;
  return `<article class="doc" aria-label="Representación gráfica de la factura ${f.numero}">
    <div class="hd"><div><b style="font-family:var(--f-display);font-size:1.2rem">${esc(DB.empresa.nombre)}</b><br><span class="muted">NIT ${esc(DB.empresa.nit)} · ${esc(s.nombre)}<br>${esc(s.direccion)}, ${esc(ciudad(s.ciudadId).nombre)}</span></div>
      <div style="text-align:right"><span class="eyebrow">Factura electrónica de venta</span><br><b class="mono" style="font-size:1.2rem">${f.numero}</b><br><span class="muted">${fdt(f.fecha)}</span></div></div>
    <dl class="kv"><dt>Cliente</dt><dd>${esc(c.nombre)} · NIT ${esc(c.nit)}</dd><dt>Destino</dt><dd>${esc(ci?.nombre)} (DANE ${esc(ci?.id)})</dd><dt>Contacto</dt><dd>${esc(c.contacto)} · ${esc(c.telefono)}</dd>${f.obs ? `<dt>Observaciones</dt><dd>${esc(f.obs)}</dd>` : ""}</dl>
    <div class="tw"><table><thead><tr><th>Referencia</th><th>Descripción</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th></tr></thead><tbody>
      ${f.items.map(it => { const p = prod(it.productoId); return `<tr><td class="mono">${esc(p.sku)}</td><td>${esc(p.nombre)}</td><td class="r">${x(it.cantidad)}</td><td class="r">${x(money(it.precio))}</td><td class="r">${x(money(it.precio * it.cantidad))}</td></tr>`; }).join("")}</tbody></table></div>
    ${oc ? `<div class="note">Conteo ciego: las cantidades y los valores se ocultan a Despachos hasta que el conteo de la remisión quede conforme.</div>` : `<div class="totals"><div><span>Subtotal</span><span>${money(f.subtotal)}</span></div><div><span>IVA 19 %</span><span>${money(f.iva)}</span></div><div class="grand"><span>Total</span><span>${money(f.total)}</span></div></div>`}
    ${f.cufe ? `<div><span class="eyebrow">CUFE (simulado, ambiente de pruebas)</span><div class="hash">${f.cufe}</div></div>` : `<p class="muted" style="font-size:.85rem">El CUFE se genera al autorizar la factura.</p>`}
    <p class="muted" style="font-size:.78rem">${esc(DB.empresa.resolucion)}</p>
  </article>`;
}
function timelineFactura(f, sinDetalle = ocultarCantidades(f)){
  const refs = [f.numero]; if (f.remisionId) refs.push(rem(f.remisionId).numero); if (f.pedidoId) refs.push(byId(DB.pedidos, f.pedidoId).numero);
  const ev = DB.audit.filter(e => refs.includes(e.ref));
  return `<ul class="tl">${ev.map(e => `<li><div><b>${esc(e.accion)}</b> <span class="mono">${esc(e.ref)}</span><br><span class="when">${fdt(e.ts)} · ${esc(e.usuario)} (${esc(e.rol)})</span>${e.detalle && !sinDetalle ? `<br><span style="font-size:.88rem">${esc(e.detalle)}</span>` : ""}</div></li>`).join("") || "<li><div>Sin eventos</div></li>"}</ul>`;
}
function dlgFactura(id){
  const f = byId(DB.facturas, id); const c = cli(f.clienteId);
  const r = f.remisionId ? rem(f.remisionId) : null;
  const acc = [];
  if (f.estado === "Pendiente" && P("facturas.autorizar")){ acc.push(`<button class="btn danger" data-act="rechazarDlg" data-id="${f.id}">Rechazar</button>`); acc.push(`<button class="btn primary" data-act="autorizar" data-id="${f.id}">Autorizar factura</button>`); }
  if (f.estado === "Autorizada" && !f.remisionId && P("despachos.gestionar")) acc.push(`<button class="btn primary" data-act="nuevaRemision" data-id="${f.id}">Crear remisión</button>`);
  if (f.estado === "Autorizada" && !f.pagada && P("cartera.pagos")) acc.push(`<button class="btn" data-act="pagar" data-id="${f.id}">Registrar pago</button>`);
  const oc = ocultarCantidades(f);
  const tabs = oc ? "doc" : UI.tab.fac || "doc";
  const certs = DB.certificados.filter(x => x.facturaId === f.id);
  openDlg(`Factura ${f.numero}`, `
    <div class="row">${pillFactura(f)} ${f.estado === "Autorizada" ? pill(...estadoLogistico(f)) : ""} ${f.pagada ? pill("Pagada","ok") : ""}</div>
    ${f.estado === "Rechazada" ? `<div class="note bad"><b>Motivo del rechazo:</b> ${esc(f.motivoRechazo)}<br><span class="muted">${esc(usr(f.revisadoPor)?.nombre)} · ${fdt(f.revisadoEn)}</span></div>` : ""}
    <div class="tabs" role="tablist">${(oc ? [["doc","Documento"]] : [["doc","Documento"],["traza","Trazabilidad"],["cont","Contabilidad"],["cert","Garantías (" + certs.length + ")"]]).map(([k, l]) => `<button role="tab" aria-selected="${tabs === k}" data-act="tab" data-g="fac" data-v="${k}" data-ref="${f.id}">${l}</button>`).join("")}</div>
    ${tabs === "doc" ? vDocFactura(f) + `<dl class="kv"><dt>Registró</dt><dd>${esc(usr(f.creadoPor)?.nombre)} (${esc(usr(f.creadoPor)?.rol)})</dd><dt>Origen</dt><dd>${f.origen === "Pedido" ? esc(origenTxt(f)) + " · contabilizada automáticamente" : "Factura manual sin pedido · requiere autorización de gerente"}</dd>${f.revisadoPor ? `<dt>${f.estado === "Rechazada" ? "Rechazó" : f.origen === "Pedido" ? "Contabilizó" : "Autorizó"}</dt><dd>${esc(nombreUsr(f.revisadoPor))} · ${fdt(f.revisadoEn)}</dd>` : ""}${r ? `<dt>Remisión</dt><dd class="mono">${r.numero} · ${esc(r.estado)}</dd>` : ""}</dl>` : ""}
    ${tabs === "traza" ? timelineFactura(f) + (f.cufe ? `<div class="row"><button class="btn" data-act="verifCufe" data-id="${f.id}">Verificar integridad del documento</button><span id="cufe-res" aria-live="polite"></span></div>` : "") : ""}
    ${tabs === "cont" ? (f.asiento ? `<p><b>Asiento ${f.asiento.numero}</b> · ${fdt(f.asiento.fecha)} · contabilización automática al autorizar</p><div class="tw"><table><thead><tr><th>Cuenta PUC</th><th>Nombre</th><th class="r">Débito</th><th class="r">Crédito</th></tr></thead><tbody>${f.asiento.lineas.map(l => `<tr><td class="mono">${l.cuenta}</td><td>${esc(l.nombre)}</td><td class="r">${l.debito ? money(l.debito) : ""}</td><td class="r">${l.credito ? money(l.credito) : ""}</td></tr>`).join("")}<tr><th colspan="2">Sumas iguales</th><th class="r">${money(sum(f.asiento.lineas, l => l.debito))}</th><th class="r">${money(sum(f.asiento.lineas, l => l.credito))}</th></tr></tbody></table></div>` : `<p class="muted">La factura se contabiliza automáticamente cuando Gerencia la autoriza.</p>`) : ""}
    ${tabs === "cert" ? (certs.length ? `<div class="tw"><table><thead><tr><th>Código</th><th>Referencia</th><th class="r">Cant.</th><th>Vence</th></tr></thead><tbody>${certs.map(x => `<tr><td class="mono">${x.codigo}</td><td>${esc(prod(x.productoId).nombre)}</td><td class="r">${x.cantidad}</td><td>${fdate(x.vence)}</td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:.85rem">El cliente verifica cada código en la sección Certificados, sin necesidad de usuario.</p>` : `<p class="muted">Los certificados de garantía se emiten al autorizar la factura (solo referencias con garantía).</p>`) : ""}
  `, acc.join(""));
}
</script>
<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Autorización de facturas manuales. */

/* --- Autorizaciones --- */
function vAutorizaciones(){
  const pend = DB.facturas.filter(f => f.estado === "Pendiente").sort((a, b) => a.fecha.localeCompare(b.fecha));
  return `<div class="page-head"><div><p class="eyebrow">Gerencia</p><h1>Autorizaciones</h1><p>Solo llegan aquí las facturas manuales, las que no vienen de un pedido de venta. Al autorizar se contabiliza el asiento, se descuenta el inventario, se genera el CUFE, se emiten los certificados de garantía y se envía la factura al cliente por correo. Quien registra una factura no puede autorizarla.</p></div></div>
  ${pend.length ? `<div class="cards">${pend.map(f => { const c = cli(f.clienteId); const disp = cupoDisponible(c, f.id); const ok = f.total <= disp; const own = f.creadoPor === ME.id;
    const sinStock = f.items.filter(it => (prod(it.productoId).stock[f.sucursalId] || 0) < it.cantidad);
    return `<article class="panel" aria-labelledby="a-${f.id}"><header><h3 id="a-${f.id}" class="mono">${f.numero}</h3>${pillFactura(f)}</header>
      <dl class="kv"><dt>Cliente</dt><dd>${esc(c.nombre)}</dd><dt>Destino</dt><dd>${esc(ciudad(f.ciudadDestinoId)?.nombre)}</dd><dt>Registró</dt><dd>${esc(usr(f.creadoPor)?.nombre)} · ${fdt(f.fecha)}</dd><dt>Total</dt><dd><b>${money(f.total)}</b> · ${f.items.length} líneas</dd><dt>Cupo</dt><dd>${ok ? pill("Disponible " + money(disp), "ok") : pill("Excede en " + money(f.total - disp), "bad")}</dd><dt>Existencias</dt><dd>${sinStock.length ? pill(sinStock.length + " sin existencia", "bad") : pill("Completas en " + suc(f.sucursalId).nombre.split(" ")[0], "ok")}</dd></dl>
      ${own ? `<div class="note warn">Tú registraste esta factura. Por segregación de funciones debe autorizarla otro gerente.</div>` : ""}
      <div class="row"><button class="btn sm" data-act="verFactura" data-id="${f.id}">Ver detalle</button><span style="flex:1"></span><button class="btn sm danger" data-act="rechazarDlg" data-id="${f.id}" ${own ? "disabled" : ""}>Rechazar</button><button class="btn sm primary" data-act="autorizar" data-id="${f.id}" ${own || !ok || sinStock.length ? "disabled" : ""}>Autorizar</button></div>
    </article>`; }).join("")}</div>` : `<div class="panel empty"><h2>No hay facturas por autorizar</h2><p>Cuando Logística registre una factura manual aparecerá aquí.</p></div>`}
  <section class="panel"><header><h2>Últimas decisiones</h2></header><div class="tw"><table><thead><tr><th>Factura</th><th>Decisión</th><th>Por</th><th>Fecha</th><th>Motivo</th></tr></thead><tbody>
  ${DB.facturas.filter(f => f.revisadoEn && f.origen !== "Pedido").sort((a, b) => b.revisadoEn.localeCompare(a.revisadoEn)).slice(0, 8).map(f => `<tr><td><button class="linklike mono" data-act="verFactura" data-id="${f.id}">${f.numero}</button></td><td>${pillFactura(f)}</td><td>${esc(nombreUsr(f.revisadoPor))}</td><td>${fdt(f.revisadoEn)}</td><td class="wrap">${esc(f.motivoRechazo || "")}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}
</script>
<script>
"use strict";
/* Motorepuestos del Oriente
   Vista · Despachos, remisiones, conteo ciego, entrega y novedades. */

/* --- Despachos --- */
function vDespachos(){
  const tab = UI.tab.desp || (P("despachos.gestionar") ? "por" : "act");
  const por = DB.facturas.filter(f => f.estado === "Autorizada" && !f.remisionId);
  const act = DB.remisiones.filter(r => ["Alistamiento","Verificada","En tránsito"].includes(r.estado)).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const hist = DB.remisiones.filter(r => ["Entregada","Con novedad"].includes(r.estado)).sort((a, b) => (b.entregadaEn || "").localeCompare(a.entregadaEn || "")).slice(0, 30);
  const nov = DB.novedades.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  const tabsDef = [["por","Por remisionar",por.length],["act","En proceso",act.length],["hist","Entregadas",null],["nov","Novedades",nov.filter(n => n.estado === "Abierta").length]];
  const remRow = r => { const f = byId(DB.facturas, r.facturaId); const c = cli(f.clienteId); return `<tr><td><button class="linklike mono" data-act="verRemision" data-id="${r.id}">${r.numero}</button></td><td class="mono">${f.numero}</td><td>${esc(c.nombre)}</td><td>${esc(ciudad(f.ciudadDestinoId)?.nombre)}</td><td>${esc(r.instrucciones.transportadora)}</td><td>${pill(r.estado, { Alistamiento:"info", Verificada:"acc", "En tránsito":"acc", Entregada:"ok", "Con novedad":"bad" }[r.estado])}</td><td>${fdt(r.entregadaEn || r.fecha)}</td></tr>`; };
  return `<div class="page-head"><div><p class="eyebrow">Bodega y transporte</p><h1>Despachos y remisiones</h1><p>Cada remisión lleva instrucciones de envío completas. Antes de salir, Bodega alista el pedido y Despachos lo verifica con conteo ciego: quien cuenta no ve la cantidad facturada. En la entrega se registra lo recibido; cualquier diferencia abre una novedad.</p></div></div>
  <div class="tabs" role="tablist">${tabsDef.map(([k, l, n]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-g="desp" data-v="${k}">${l}${n ? ` (${n})` : ""}</button>`).join("")}</div>
  ${tab === "por" ? (por.length ? `<div class="tw"><table><thead><tr><th>Factura</th><th>Autorizada</th><th>Cliente</th><th>Destino</th><th class="r">Líneas</th><th></th></tr></thead><tbody>${por.map(f => `<tr><td><button class="linklike mono" data-act="verFactura" data-id="${f.id}">${f.numero}</button></td><td>${fdt(f.revisadoEn)}</td><td>${esc(cli(f.clienteId).nombre)}</td><td>${esc(ciudad(f.ciudadDestinoId)?.nombre)}</td><td class="r">${f.items.length}</td><td>${P("despachos.gestionar") ? `<button class="btn sm primary" data-act="nuevaRemision" data-id="${f.id}">Crear remisión</button>` : ""}</td></tr>`).join("")}</tbody></table></div>` : `<div class="panel empty">No hay facturas autorizadas pendientes de remisión.</div>`) : ""}
  ${tab === "act" ? (act.length ? `<div class="tw"><table><thead><tr><th>Remisión</th><th>Factura</th><th>Cliente</th><th>Destino</th><th>Transportadora</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${act.map(remRow).join("")}</tbody></table></div>` : `<div class="panel empty">No hay remisiones en proceso.</div>`) : ""}
  ${tab === "hist" ? `<div class="tw"><table><thead><tr><th>Remisión</th><th>Factura</th><th>Cliente</th><th>Destino</th><th>Transportadora</th><th>Estado</th><th>Entregada</th></tr></thead><tbody>${hist.map(remRow).join("")}</tbody></table></div>` : ""}
  ${tab === "nov" ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Remisión</th><th>Detalle</th><th>Estado</th><th></th></tr></thead><tbody>${nov.map(n => `<tr><td>${fdt(n.fecha)}</td><td>${esc(n.tipo)}</td><td class="mono">${esc(rem(n.remisionId)?.numero)}</td><td class="wrap">${verificaCiego() && rem(n.remisionId)?.estado === "Alistamiento" ? "Diferencia en el conteo. El detalle lo ven Bodega y Gerencia hasta que el conteo quede conforme." : esc(n.detalle)}${n.resolucion ? `<br><span class="muted">Resolución: ${esc(n.resolucion)}</span>` : ""}</td><td>${pill(n.estado, n.estado === "Abierta" ? "bad" : "ok")}</td><td>${n.estado === "Abierta" && (P("facturas.autorizar") || P("despachos.gestionar")) ? `<button class="btn sm" data-act="cerrarNovDlg" data-id="${n.id}">Cerrar</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Sin novedades.</td></tr>`}</tbody></table></div>` : ""}`;
}
function dlgNuevaRemision(fid){
  const f = byId(DB.facturas, fid), c = cli(f.clienteId);
  openDlg(`Nueva remisión · factura ${f.numero}`, `
    <form id="frm-rem" data-form="remision" data-id="${f.id}" class="grid" novalidate>
      <p class="muted">Los datos se precargan del cliente; ajústalos si el pedido indica otra cosa.</p>
      <div class="grid g2">
        <div class="field"><label for="r-dir">Dirección de entrega *</label><input id="r-dir" name="direccion" required value="${esc(c.direccion)}"></div>
        <div class="field"><label for="r-ref">Punto de referencia</label><input id="r-ref" name="referencia" placeholder="Ej.: diagonal al parque principal, portón verde"></div>
        <div class="field"><label for="r-con">Recibe *</label><input id="r-con" name="contacto" required value="${esc(c.contacto)}"></div>
        <div class="field"><label for="r-tel">Teléfono *</label><input id="r-tel" name="telefono" required inputmode="tel" value="${esc(c.telefono)}"></div>
        <div class="field"><label for="r-tr">Transportadora *</label><select id="r-tr" name="transportadora">${DB.transportadoras.map(t => `<option>${esc(t)}</option>`).join("")}</select></div>
        <div class="field"><label for="r-gu">Número de guía</label><input id="r-gu" name="guia" placeholder="Obligatorio si no es flota propia"></div>
        <div class="field"><label for="r-fr">Franja de entrega</label><select id="r-fr" name="franja"><option>8:00 a. m. – 12:00 m.</option><option>2:00 p. m. – 6:00 p. m.</option><option>Todo el día</option></select></div>
        <div class="field"><label for="r-dest">Municipio</label><input id="r-dest" value="${esc(ciudad(f.ciudadDestinoId)?.nombre)}" disabled></div>
      </div>
      <div class="field"><label for="r-obs">Instrucciones especiales</label><textarea id="r-obs" name="observaciones">Entregar únicamente a la persona de contacto. Exigir firma y cédula.</textarea></div>
      <div id="rem-err" role="alert"></div>
    </form>`, `<button class="btn" data-act="cerrarDlg">Cancelar</button><button class="btn primary" type="submit" form="frm-rem">Crear remisión</button>`);
}
function dlgRemision(id){
  const r = rem(id), f = byId(DB.facturas, r.facturaId), c = cli(f.clienteId), I = r.instrucciones;
  const puede = P("despachos.gestionar");
  let cuerpo = `<div class="row">${pill(r.estado, { Alistamiento:"info", Verificada:"acc", "En tránsito":"acc", Entregada:"ok", "Con novedad":"bad" }[r.estado])}${r.sello ? pill("Sello " + r.sello, "") : ""}</div>
    <dl class="kv"><dt>Factura</dt><dd class="mono">${f.numero}</dd><dt>Cliente</dt><dd>${esc(c.nombre)}</dd><dt>Entregar en</dt><dd>${esc(I.direccion)}${I.referencia ? " · " + esc(I.referencia) : ""}, ${esc(ciudad(f.ciudadDestinoId)?.nombre)}</dd><dt>Recibe</dt><dd>${esc(I.contacto)} · ${esc(I.telefono)}</dd><dt>Transporte</dt><dd>${esc(I.transportadora)}${I.guia ? " · guía " + esc(I.guia) : ""} · ${esc(I.franja)}</dd><dt>Instrucciones</dt><dd>${esc(I.observaciones || "—")}</dd>${r.recibidoPor ? `<dt>Recibió</dt><dd>${esc(r.recibidoPor)} · ${fdt(r.entregadaEn)}</dd>` : ""}</dl>`;
  let foot = `<button class="btn" data-act="cerrarDlg">Cerrar</button>`;
  if (r.estado === "Alistamiento"){
    const alisto = r.alistadoPor ? usr(r.alistadoPor) : null;
    if (r.conteoFallido && !alisto) cuerpo += `<div class="note bad" role="alert"><b>El conteo no coincide con la factura en ${r.conteoFallido} ${r.conteoFallido === 1 ? "referencia" : "referencias"}.</b> No se puede despachar. Se registró una novedad y el pedido volvió a Bodega para revisar el alistamiento.</div>`;
    if (!alisto){
      // Paso 1: Bodega alista viendo las cantidades
      if (P("despachos.alistar")){
        cuerpo += `<section class="grid"><h3>Lista de alistamiento</h3><p class="muted">Saca del estante cada referencia en la cantidad indicada y déjala en la zona de despacho. Después, Despachos la verifica con conteo ciego.</p>
          <div class="tw"><table><thead><tr><th>Referencia</th><th>Descripción</th><th class="r">Cantidad a alistar</th></tr></thead><tbody>${r.items.map(it => { const p = prod(it.productoId); return `<tr><td class="mono">${esc(p.sku)}</td><td>${esc(p.nombre)}</td><td class="r num">${it.cantidad}</td></tr>`; }).join("")}</tbody></table></div></section>`;
        foot += `<button class="btn primary" data-act="alistar" data-id="${r.id}">Marcar como alistado</button>`;
      } else cuerpo += `<div class="note">Esperando a que <b>Bodega</b> aliste el pedido. El conteo ciego se habilita cuando Bodega lo marque como alistado.</div>`;
    } else {
      cuerpo += `<p class="muted">Alistado por <b>${esc(alisto.nombre)}</b> (${esc(alisto.rol)}) · ${fdt(r.alistadoEn)}</p>`;
      // Paso 2: Despachos verifica sin ver la cantidad facturada (y no puede ser quien alistó)
      if (puede && r.alistadoPor !== ME.id){
        cuerpo += `<form id="frm-conteo" data-form="conteo" data-id="${r.id}" class="grid"><h3>Conteo ciego de verificación</h3><p class="muted">Cuenta físicamente lo que Bodega alistó y escribe la cantidad. El sistema la compara con la factura sin mostrarla.</p>
      <div class="tw"><table><thead><tr><th>Referencia</th><th>Descripción</th><th class="r" style="width:140px">Cantidad contada</th></tr></thead><tbody>${r.items.map((it, i) => { const p = prod(it.productoId); return `<tr><td class="mono">${esc(p.sku)}</td><td>${esc(p.nombre)}</td><td><label class="sr" for="cc-${i}">Cantidad contada de ${esc(p.sku)}</label><input id="cc-${i}" name="c${i}" type="number" min="0" required inputmode="numeric" style="text-align:right"></td></tr>`; }).join("")}</tbody></table></div><div id="conteo-res" role="alert"></div></form>`;
        foot += `<button class="btn primary" type="submit" form="frm-conteo">Verificar conteo</button>`;
      } else if (puede) cuerpo += `<div class="note warn">Tú alistaste este pedido: el conteo de verificación lo debe hacer otra persona de Despachos.</div>`;
      else cuerpo += `<div class="note">Esperando el conteo ciego de <b>Despachos</b>.</div>`;
    }
  } else if (r.estado === "Verificada"){
    cuerpo += itemsTabla(r, false);
    if (puede) foot += `<button class="btn primary" data-act="despachar" data-id="${r.id}">Registrar salida de bodega</button>`;
  } else if (r.estado === "En tránsito"){
    cuerpo += `<form id="frm-ent" data-form="entrega" data-id="${r.id}" class="grid"><h3>Registrar entrega</h3><p class="muted">Escribe lo que el cliente recibió y firmó. Si no coincide con lo despachado, se abre una novedad.</p>
      <div class="field"><label for="en-rec">Nombre de quien recibe *</label><input id="en-rec" name="recibe" required value="${esc(I.contacto)}"></div>
      <div class="tw"><table><thead><tr><th>Referencia</th><th class="r">Despachado</th><th class="r" style="width:140px">Recibido</th></tr></thead><tbody>${r.items.map((it, i) => { const p = prod(it.productoId); return `<tr><td><span class="mono">${esc(p.sku)}</span> ${esc(p.nombre)}</td><td class="r">${it.cantidad}</td><td><label class="sr" for="er-${i}">Recibido de ${esc(p.sku)}</label><input id="er-${i}" name="r${i}" type="number" min="0" value="${it.cantidad}" required style="text-align:right"></td></tr>`; }).join("")}</tbody></table></div></form>`;
    if (puede) foot += `<button class="btn primary" type="submit" form="frm-ent">Confirmar entrega</button>`;
  } else {
    cuerpo += itemsTabla(r, true);
  }
  cuerpo += `<h3>Trazabilidad</h3>` + timelineFactura(f, ocultarCantidades(f));
  openDlg(`Remisión ${r.numero}`, cuerpo, foot);
}
function itemsTabla(r, conRecibido){
  return `<div class="tw"><table><thead><tr><th>Referencia</th><th class="r">Facturado</th><th class="r">Contado</th>${conRecibido ? '<th class="r">Recibido</th>' : ""}</tr></thead><tbody>${r.items.map(it => { const p = prod(it.productoId); const bad = conRecibido && it.recibido !== it.cantidad; return `<tr><td><span class="mono">${esc(p.sku)}</span> ${esc(p.nombre)}</td><td class="r">${it.cantidad}</td><td class="r">${it.contado ?? "—"}</td>${conRecibido ? `<td class="r" style="${bad ? "color:var(--bad);font-weight:700" : ""}">${it.recibido ?? "—"}</td>` : ""}</tr>`; }).join("")}</tbody></table></div>`;
}
