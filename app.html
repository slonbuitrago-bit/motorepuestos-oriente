<title>Motorepuestos del Oriente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sistema de facturación, despachos, inventario, importaciones y trazabilidad para Motorepuestos del Oriente (Rionegro, Antioquia).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: "taller-ledger" app shell — graphite tool rail on the left, cool steel work surface, petrol accent; brand orange only on the mark */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E7ECF0; --ink:#14202A; --muted:#51606C; --line:#D0D8DF;
  --accent:#0A6A75; --accent-ink:#FFFFFF; --accent-soft:#D5EBED;
  --brand:#D9581A;
  --ok:#1B7637; --ok-soft:#DCF0E2; --warn:#8F5300; --warn-soft:#F9EACF; --bad:#B42318; --bad-soft:#FADFDB; --info:#2C5AAE; --info-soft:#DEE7F7;
  --rail:#131D26; --rail-ink:#C3CFD9; --rail-hi:#FFFFFF; --rail-line:#25323E; --rail-act:#1E2D3A;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --scale:1; --lh:1.5; --ls:0em; --ws:0em; --bw:1px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E5ECF1; --muted:#9BABB8; --line:#2A3946;
  --accent:#4EC1CC; --accent-ink:#04232A; --accent-soft:#103A40; --brand:#F07A3C;
  --ok:#62CF86; --ok-soft:#123222; --warn:#F2B552; --warn-soft:#3A2A0E; --bad:#FF8B7C; --bad-soft:#3E1814; --info:#8DB2FF; --info-soft:#18284A;
  --rail:#0A1015; --rail-ink:#AEBBC6; --rail-hi:#FFFFFF; --rail-line:#1C2731; --rail-act:#18242F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E5ECF1; --muted:#9BABB8; --line:#2A3946;
  --accent:#4EC1CC; --accent-ink:#04232A; --accent-soft:#103A40; --brand:#F07A3C;
  --ok:#62CF86; --ok-soft:#123222; --warn:#F2B552; --warn-soft:#3A2A0E; --bad:#FF8B7C; --bad-soft:#3E1814; --info:#8DB2FF; --info-soft:#18284A;
  --rail:#0A1015; --rail-ink:#AEBBC6; --rail-hi:#FFFFFF; --rail-line:#1C2731; --rail-act:#18242F; color-scheme:dark }
/* Accesibilidad: alto contraste, espaciado amplio, subrayado */
:root[data-contrast="alto"]{ --muted:var(--ink); --line:var(--ink); --rail-ink:var(--rail-hi); --bw:2px }
:root[data-espaciado="amplio"]{ --lh:1.8; --ls:.03em; --ws:.12em }
html{ font-size:calc(16px * var(--scale)) }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:1rem; line-height:var(--lh); letter-spacing:var(--ls); word-spacing:var(--ws) }
:root[data-subrayar="si"] a, :root[data-subrayar="si"] .linklike{ text-decoration:underline!important; text-underline-offset:3px }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; scroll-behavior:auto!important } }
:root[data-movimiento="reducido"] *{ animation:none!important; transition:none!important }
*{ box-sizing:border-box }
h1,h2,h3{ font-family:var(--f-display); letter-spacing:.01em; text-wrap:balance; margin:0; line-height:1.15 }
h1{ font-size:2rem; font-weight:700 }
h2{ font-size:1.4rem; font-weight:600 }
h3{ font-size:1.1rem; font-weight:600 }
p{ margin:0 }
a{ color:var(--accent) }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:3px }
.mono{ font-family:var(--f-mono); font-size:.86em; letter-spacing:0 }
.num{ font-variant-numeric:tabular-nums }
.muted{ color:var(--muted) }
.eyebrow{ font-size:.75rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700 }
.sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.skip{ position:fixed; left:max(12px, env(safe-area-inset-left,0px)); top:calc(env(safe-area-inset-top,0px) - 60px); z-index:100; background:var(--accent); color:var(--accent-ink); padding:10px 14px; border-radius:6px; font-weight:700; text-decoration:none }
.skip:focus{ top:calc(env(safe-area-inset-top,0px) + 10px) }

/* Shell */
.shell{ display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh }
.rail{ background:var(--rail); color:var(--rail-ink); padding-block:18px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:18px; padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:14px }
.brand{ display:flex; align-items:center; gap:10px; color:var(--rail-hi); padding:0 6px }
.mark{ width:38px; height:38px; flex:none; border-radius:8px; background:var(--brand); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; color:#fff; font-size:1.05rem; letter-spacing:.02em }
.brand b{ font-family:var(--f-display); font-size:1.2rem; line-height:1.05; display:block; font-weight:700 }
.brand small{ font-size:.72rem; color:var(--rail-ink); letter-spacing:.06em; text-transform:uppercase }
.nav{ display:flex; flex-direction:column; gap:2px }
.nav .grp{ font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--rail-ink); opacity:.75; padding:12px 10px 4px }
.nav a{ display:flex; align-items:center; gap:10px; color:var(--rail-ink); text-decoration:none; padding:8px 10px; border-radius:6px; font-size:.95rem }
.nav a svg{ width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8 }
.nav a:hover{ background:var(--rail-act); color:var(--rail-hi) }
.nav a[aria-current="page"]{ background:var(--rail-act); color:var(--rail-hi); box-shadow:inset 3px 0 0 var(--brand) }
.nav .count{ margin-left:auto; background:var(--brand); color:#fff; font-size:.72rem; font-weight:700; border-radius:10px; padding:1px 7px }
.rail .me{ margin-top:auto; border-top:1px solid var(--rail-line); padding:14px 6px 0; font-size:.88rem }
.rail .me b{ color:var(--rail-hi); display:block }
.main{ min-width:0; display:flex; flex-direction:column; position:relative }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:var(--bw) solid var(--line); display:flex; align-items:center; gap:10px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg) }
.topbar .crumb{ font-family:var(--f-display); font-size:1.15rem; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.topbar .sp{ flex:1 }
.menu-btn{ display:none }
#main{ padding-block:22px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); max-width:1320px; width:100%; display:flex; flex-direction:column; gap:22px }
#main:focus{ outline:none }
@media (max-width: 900px){
  .shell{ grid-template-columns:minmax(0,1fr) }
  .rail{ position:fixed; inset:0 auto 0 0; width:min(86vw,300px); z-index:50; transform:translateX(-102%); transition:transform .2s ease; padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)) }
  .rail.open{ transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.45) }
  .menu-btn{ display:inline-flex }
  h1{ font-size:1.7rem }
}

/* Controls */
.btn{ font:inherit; font-weight:700; font-size:.92rem; letter-spacing:normal; border-radius:6px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:40px; text-decoration:none; line-height:1.2 }
.btn:hover{ border-color:var(--accent) }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn.primary:hover{ filter:brightness(1.08) }
.btn.danger{ color:var(--bad); border-color:var(--bad) }
.btn.ghost{ background:transparent; border-color:transparent }
.btn.ghost:hover{ background:var(--surface-2) }
.btn.sm{ min-height:32px; padding:5px 10px; font-size:.85rem }
.btn[disabled]{ opacity:.5; cursor:not-allowed }
.btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2 }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center }
.between{ justify-content:space-between }
label{ font-weight:700; font-size:.88rem; display:block }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0 }
.field .hint{ font-size:.8rem; color:var(--muted); font-weight:400 }
input,select,textarea{ font:inherit; font-size:.95rem; letter-spacing:normal; color:var(--ink); background:var(--surface); border:var(--bw) solid var(--line); border-radius:6px; padding:8px 10px; min-height:40px; width:100%; min-width:0 }
input:focus,select:focus,textarea:focus{ border-color:var(--accent); outline:2px solid var(--accent-soft); outline-offset:0 }
input[aria-invalid="true"],select[aria-invalid="true"]{ border-color:var(--bad) }
textarea{ min-height:80px; resize:vertical }
.grid{ display:grid; gap:14px }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)) }
@media (max-width: 760px){ .g2,.g3,.g4{ grid-template-columns:minmax(0,1fr) } }
@media (min-width: 761px) and (max-width: 1100px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)) } .g3{ grid-template-columns:repeat(2,minmax(0,1fr)) } }

.panel{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0 }
.panel > header{ display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between }
.page-head{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between }
.page-head p{ color:var(--muted); max-width:65ch; margin-top:4px }

/* KPI strip */
.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:8px }
.kpi{ padding:14px 16px; border-left:var(--bw) solid var(--line); display:flex; flex-direction:column; gap:2px; min-width:0 }
.kpi:first-child{ border-left:0 }
.kpi .v{ font-family:var(--f-display); font-size:1.9rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1 }
.kpi .l{ font-size:.82rem; color:var(--muted) }
.kpi .d{ font-size:.78rem }
@media (max-width: 1100px){ .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)) } .kpi{ border-left:0; border-top:var(--bw) solid var(--line) } .kpi:nth-child(-n+2){ border-top:0 } .kpi:nth-child(even){ border-left:var(--bw) solid var(--line) } }

/* Tables */
.tw{ overflow-x:auto; border:var(--bw) solid var(--line); border-radius:8px; background:var(--surface) }
table{ border-collapse:collapse; width:100%; font-size:.92rem }
th,td{ text-align:left; padding:9px 12px; border-bottom:var(--bw) solid var(--line); vertical-align:middle; white-space:nowrap }
td.wrap{ white-space:normal; min-width:200px }
th{ font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); background:var(--surface-2); position:sticky; top:0 }
tbody tr:last-child td{ border-bottom:0 }
tbody tr:hover{ background:var(--surface-2) }
td.r, th.r{ text-align:right; font-variant-numeric:tabular-nums }
.linklike{ background:none; border:0; padding:0; font:inherit; color:var(--accent); cursor:pointer; font-weight:700; text-align:left }
.empty{ padding:28px; text-align:center; color:var(--muted) }

/* Pills */
.pill{ display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink); white-space:nowrap }
.pill::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.9 }
.pill.ok{ background:var(--ok-soft); color:var(--ok) }
.pill.warn{ background:var(--warn-soft); color:var(--warn) }
.pill.bad{ background:var(--bad-soft); color:var(--bad) }
.pill.info{ background:var(--info-soft); color:var(--info) }
.pill.acc{ background:var(--accent-soft); color:var(--accent) }

.note{ border-radius:8px; padding:12px 14px; background:var(--info-soft); color:var(--ink); border-left:4px solid var(--info); font-size:.92rem }
.note.bad{ background:var(--bad-soft); border-color:var(--bad) }
.note.ok{ background:var(--ok-soft); border-color:var(--ok) }
.note.warn{ background:var(--warn-soft); border-color:var(--warn) }

/* Charts */
.chart svg{ width:100%; height:auto; display:block }
.chart text{ fill:var(--muted); font-family:var(--f-body); font-size:12px }
.hbars{ display:flex; flex-direction:column; gap:8px }
.hbar{ display:grid; grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:.88rem }
.hbar .track{ height:12px; background:var(--surface-2); border-radius:3px; overflow:hidden }
.hbar .fill{ height:100%; background:var(--accent); border-radius:3px }
.meter{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; min-width:80px }
.meter > span{ display:block; height:100%; background:var(--ok) }
.meter.warn > span{ background:var(--warn) } .meter.bad > span{ background:var(--bad) }

/* Tabs */
.tabs{ display:flex; gap:4px; border-bottom:var(--bw) solid var(--line); overflow-x:auto }
.tabs button{ font:inherit; font-weight:700; background:none; border:0; border-bottom:3px solid transparent; padding:10px 12px; color:var(--muted); cursor:pointer; white-space:nowrap }
.tabs button[aria-selected="true"]{ color:var(--ink); border-color:var(--accent) }

/* Timeline */
.tl{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
.tl li{ display:grid; grid-template-columns:16px minmax(0,1fr); gap:12px; padding-bottom:14px; position:relative }
.tl li::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-top:6px; margin-left:3px }
.tl li::after{ content:""; position:absolute; left:7px; top:18px; bottom:0; width:2px; background:var(--line) }
.tl li:last-child::after{ display:none }
.tl .when{ font-size:.8rem; color:var(--muted) }

/* Dialog */
dialog{ border:var(--bw) solid var(--line); border-radius:10px; padding:0; background:var(--surface); color:var(--ink); width:min(860px, calc(100vw - 24px)); max-height:calc(100vh - 32px) }
dialog::backdrop{ background:rgba(8,14,20,.55) }
.dlg-head{ display:flex; gap:10px; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:var(--bw) solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2 }
.dlg-body{ padding:18px; display:flex; flex-direction:column; gap:16px }
.dlg-foot{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:var(--bw) solid var(--line); position:sticky; bottom:0; background:var(--surface) }

/* Invoice document */
.doc{ border:var(--bw) solid var(--line); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:14px; background:var(--surface) }
.doc .hd{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px }
.kv{ display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 14px; font-size:.9rem }
.kv dt{ color:var(--muted) } .kv dd{ margin:0; min-width:0; overflow-wrap:anywhere }
.totals{ margin-left:auto; min-width:min(280px,100%) }
.totals div{ display:flex; justify-content:space-between; gap:20px; padding:3px 0; font-variant-numeric:tabular-nums }
.totals .grand{ border-top:var(--bw) solid var(--ink); font-weight:700; font-size:1.1rem; padding-top:6px }
.hash{ font-family:var(--f-mono); font-size:.75rem; overflow-wrap:anywhere; color:var(--muted) }

/* Toasts */
#toasts{ position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:200; display:flex; flex-direction:column; gap:8px; max-width:min(420px, calc(100vw - 32px)) }
.toast{ background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:8px; font-size:.92rem; box-shadow:0 6px 24px rgba(0,0,0,.25); animation:tin .2s ease }
.toast.bad{ background:var(--bad); color:#fff }
@keyframes tin{ from{ transform:translateY(8px); opacity:.4 } }

/* A11y panel */
.a11y{ position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:56px; z-index:40; width:min(340px, calc(100vw - 32px)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.2); padding:16px; display:flex; flex-direction:column; gap:12px }
.switch{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:400 }
.switch input{ width:auto; min-height:0; accent-color:var(--accent); width:20px; height:20px }
.seg{ display:inline-flex; border:var(--bw) solid var(--line); border-radius:6px; overflow:hidden }
.seg button{ font:inherit; border:0; background:var(--surface); color:var(--ink); padding:6px 12px; cursor:pointer; min-width:44px; font-weight:700 }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink) }

/* Login */
.login{ min-height:100vh; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) }
.login .side{ background:var(--rail); color:var(--rail-ink); padding-block:48px; padding-left:max(28px, env(safe-area-inset-left,0px)); padding-right:28px; display:flex; flex-direction:column; gap:22px; justify-content:center }
.login .side h1{ color:var(--rail-hi); font-size:clamp(2.2rem, 5vw, 3.6rem); line-height:1 }
.login .side p{ max-width:52ch }
.login .facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; max-width:560px }
.login .facts div{ border-top:2px solid var(--brand); padding-top:8px; font-size:.85rem }
.login .facts b{ display:block; color:var(--rail-hi); font-family:var(--f-display); font-size:1.5rem }
.login .form{ padding-block:40px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:16px; justify-content:center; max-width:560px }
.users{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.ucard{ text-align:left; font:inherit; background:var(--surface); color:var(--ink); border:var(--bw) solid var(--line); border-radius:8px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:2px }
.ucard:hover{ border-color:var(--accent) }
.ucard[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) }
.ucard small{ color:var(--muted) }
@media (max-width: 860px){ .login{ grid-template-columns:minmax(0,1fr) } .login .side{ padding-block:32px } .login .facts{ grid-template-columns:repeat(3,minmax(0,1fr)) } .users{ grid-template-columns:minmax(0,1fr) } }

.items-table input, .items-table select{ min-height:36px; padding:6px 8px }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px }
.task{ display:flex; gap:12px; align-items:center; padding:12px 14px; border:var(--bw) solid var(--line); border-radius:8px; background:var(--surface) }
.task .n{ font-family:var(--f-display); font-size:1.8rem; font-weight:700; min-width:2ch; text-align:center; color:var(--accent) }
.task div{ flex:1; min-width:0 }
.chk{ display:flex; align-items:flex-start; gap:10px; font-weight:400 }
.chk input{ width:20px; height:20px; min-height:0; flex:none; margin-top:2px; accent-color:var(--accent) }
.matrix td{ text-align:center } .matrix td:first-child, .matrix th:first-child{ text-align:left }
.matrix input{ width:20px; height:20px; min-height:0; accent-color:var(--accent) }
</style>

<script>
"use strict";
/* =========================================================================
   Motorepuestos del Oriente — Sistema de gestión comercial
   Arquitectura: SPA de un solo archivo, datos en almacenamiento local del
   navegador (prototipo). Ver docs/ para el modelo relacional definitivo.
   ========================================================================= */

function verificarCadena(){
  let prev = "0".repeat(64);
  for (const e of DB.audit){
    if (e.prev !== prev || sha(prev + "|" + canonAudit(e)) !== e.hash) return { ok:false, seq:e.seq };

    ev(d, "Registrar factura manual", "Factura", f.numero, c.nombre + " · " + money(f.total), creador);
    ev(new Date(+d + 2000), "Validar cupo del cliente", "Factura", f.numero, "Cupo suficiente", creador);
  };
  mk("C4", "S1", [["PR4",4],["PR3",10],["PR1",24]], 3, "U3");
  mk("C3", "S3", [["PR6",12],["PR12",20]], 1.5, "U7");
  // Las existencias de la tabla representan el saldo actual después del histórico
  prods.forEach((p, i) => { db.productos[i].stock = { S1:p[7][0], S2:p[7][1], S3:p[7][2] }; });
  events.sort((a, b) => a[0] < b[0] ? -1 : 1);
  const saveDB = DB; DB = db;
  ev(now, "Inicializar datos de demostración", "Sistema", "", "Base de datos de ejemplo creada", "U1");
  events.forEach(e => audit(e[1], e[2], e[3], e[4], { at:e[0], user:e[5] }));
  DB = saveDB;
  return db;
}
function nextNumDb(db, key){ db.seq[key] = (db.seq[key] || 0) + 1; return db.seq[key]; }
function difDetalle(db, items, campo){
  return items.filter(it => it[campo] !== it.cantidad).map(it => { const p = byId(db.productos, it.productoId); return p.sku + ": facturado " + it.cantidad + ", " + (campo === "recibido" ? "recibido " : "contado ") + it[campo]; }).join("; ");
}
function calcTotales(items){ const subtotal = sum(items, it => it.cantidad * it.precio); const iva = Math.round(subtotal * IVA); return { subtotal, iva, total: subtotal + iva }; }
function buildFactura(db, clienteId, sucursalId, ciudadId, items, fecha, creadorId){
  const n = nextNumDb(db, "FAC");
  const t = calcTotales(items);
  const f = { id:"F" + n, numero:"MRO-" + String(1000 + n).padStart(6, "0"), fecha, clienteId, sucursalId, ciudadDestinoId:ciudadId, items, ...t, estado:"Pendiente", creadoPor:creadorId, pagada:false };
  db.facturas.push(f); return f;
}
function autorizarFactura(db, f, userId, ts){
  f.estado = "Autorizada"; f.revisadoPor = userId; f.revisadoEn = ts;
  f.cufe = cufe.call(null, f, db);
  const costo = sum(f.items, it => it.cantidad * byId(db.productos, it.productoId).costo);
  f.asiento = { numero:"CNT-" + String(nextNumDb(db, "CNT")).padStart(5, "0"), fecha:ts, lineas:[
    { cuenta:"130505", nombre:"Clientes nacionales", debito:f.total, credito:0 },
    { cuenta:"413515", nombre:"Venta de partes, piezas y accesorios", debito:0, credito:f.subtotal },
    { cuenta:"240805", nombre:"IVA generado 19 %", debito:0, credito:f.iva },
    { cuenta:"613515", nombre:"Costo de ventas — repuestos", debito:costo, credito:0 },
    { cuenta:"143501", nombre:"Inventario de mercancías", debito:0, credito:costo }
  ]};
  const u = db.usuarios.find(x => x.id === userId);
  f.items.forEach((it, i) => {
    const p = byId(db.productos, it.productoId);
    p.stock[f.sucursalId] = Math.max(0, (p.stock[f.sucursalId] || 0) - it.cantidad);
    db.kardex.push({ fecha:ts, productoId:it.productoId, sucursalId:f.sucursalId, tipo:"Salida por factura", cantidad:-it.cantidad, ref:f.numero, usuario:u ? u.nombre : "" });
    if (p.garantiaMeses > 0){
      const vence = new Date(ts); vence.setMonth(vence.getMonth() + p.garantiaMeses);
      db.certificados.push({ codigo:certCode(f, it, i), facturaId:f.id, productoId:p.id, clienteId:f.clienteId, cantidad:it.cantidad, emitido:ts, vence:vence.toISOString() });
    }
  });
}
function buildRemision(db, f, ts, instr){
  const n = nextNumDb(db, "REM");
  const r = { id:"R" + n, numero:"REM-" + String(n).padStart(5, "0"), facturaId:f.id, fecha:ts, estado:"Alistamiento", instrucciones:instr, items:f.items.map(it => ({ productoId:it.productoId, cantidad:it.cantidad, contado:null, recibido:null })) };
  db.remisiones.push(r); f.remisionId = r.id; return r;
}

function vInicio(){
  const fs = UI.filtros.dashSuc || "";
  const F = DB.facturas.filter(f => !fs || f.sucursalId === fs);
  const aut = F.filter(f => f.estado === "Autorizada");
  const now = new Date();
  const mesAct = aut.filter(f => { const d = new Date(f.fecha); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const mesAnt = aut.filter(f => { const d = new Date(f.fecha); const p = new Date(now.getFullYear(), now.getMonth() - 1, 1); return d.getMonth() === p.getMonth() && d.getFullYear() === p.getFullYear() && d.getDate() <= now.getDate(); });
  const vAct = sum(mesAct, f => f.subtotal), vAnt = sum(mesAnt, f => f.subtotal);
  const delta = vAnt ? (vAct - vAnt) / vAnt * 100 : 0;
  const pend = F.filter(f => f.estado === "Pendiente").length;
  const rems = DB.remisiones.filter(r => { const f = byId(DB.facturas, r.facturaId); return !fs || f.sucursalId === fs; });
  const transito = rems.filter(r => r.estado === "En tránsito").length;
  const cerradas = rems.filter(r => r.estado === "Entregada" || r.estado === "Con novedad");
  const conformes = cerradas.length ? cerradas.filter(r => r.estado === "Entregada").length / cerradas.length * 100 : 100;
  const bajo = DB.productos.filter(p => stockTotal(p) < p.minimo * 1.6);
  const novAb = DB.novedades.filter(n => n.estado === "Abierta").length;

  // ventas por mes (6)
  const meses = [];
  for (let m = 5; m >= 0; m--){ const d = new Date(now.getFullYear(), now.getMonth() - m, 1); meses.push({ y:d.getFullYear(), m:d.getMonth(), label:MESES[d.getMonth()], value:0 }); }
  aut.forEach(f => { const d = new Date(f.fecha); const x = meses.find(z => z.y === d.getFullYear() && z.m === d.getMonth()); if (x) x.value += f.subtotal; });
  // ventas por municipio
  const mun = {};
  aut.forEach(f => { const c = ciudad(f.ciudadDestinoId)?.nombre || "—"; mun[c] = (mun[c] || 0) + f.subtotal; });
  const munArr = Object.entries(mun).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const maxMun = munArr.length ? munArr[0][1] : 1;
  // top productos
  const tp = {};
  aut.forEach(f => f.items.forEach(it => tp[it.productoId] = (tp[it.productoId] || 0) + it.cantidad * it.precio));
  const top = Object.entries(tp).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const totalTop = sum(Object.values(tp), x => x) || 1;

  const tareas = [];
  if (P("facturas.autorizar")) tareas.push([pend, "facturas esperan tu autorización", "Revisa cantidades, cupo y destino antes de autorizar.", "autorizaciones"]);

function barChart(data){
  const W = 600, H = 240, pl = 64, pb = 28, pt = 14, pr = 10;
  const max = Math.max(1, ...data.map(d => d.value));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / data.length;
  let g = "";
  for (let v = 0; v <= top; v += step){ const y = pt + ih - v / top * ih; g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${short(v)}</text>`; }
  data.forEach((d, i) => {
    const h = d.value / top * ih, x = pl + i * bw + bw * .2, y = pt + ih - h;
    const last = i === data.length - 1;
    g += `<rect x="${x}" y="${y}" width="${bw * .6}" height="${h}" rx="3" fill="var(--accent)" opacity="${last ? 1 : .55}"/>`;
    g += `<text x="${x + bw * .3}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
    if (last) g += `<text x="${x + bw * .3}" y="${y - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${short(d.value)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras de ventas de los últimos seis meses">${g}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function short(v){ return v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".", ",") + " M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + " mil" : "$" + v; }

/* --- Autorizaciones --- */
function vAutorizaciones(){
  const pend = DB.facturas.filter(f => f.estado === "Pendiente").sort((a, b) => a.fecha.localeCompare(b.fecha));
  return `<div class="page-head"><div><p class="eyebrow">Caso de uso · Autorizar factura manual</p><h1>Autorizaciones</h1><p>Al autorizar se descuenta el inventario, se genera el CUFE, se emiten los certificados de garantía y se contabiliza el asiento. Quien registra una factura no puede autorizarla.</p></div></div>
  ${pend.length ? `<div class="cards">${pend.map(f => { const c = cli(f.clienteId); const disp = cupoDisponible(c, f.id); const ok = f.total <= disp; const own = f.creadoPor === ME.id;
    const sinStock = f.items.filter(it => (prod(it.productoId).stock[f.sucursalId] || 0) < it.cantidad);
    return `<article class="panel" aria-labelledby="a-${f.id}"><header><h3 id="a-${f.id}" class="mono">${f.numero}</h3>${pillFactura(f)}</header>
      <dl class="kv"><dt>Cliente</dt><dd>${esc(c.nombre)}</dd><dt>Destino</dt><dd>${esc(ciudad(f.ciudadDestinoId)?.nombre)}</dd><dt>Registró</dt><dd>${esc(usr(f.creadoPor)?.nombre)} · ${fdt(f.fecha)}</dd><dt>Total</dt><dd><b>${money(f.total)}</b> · ${f.items.length} líneas</dd><dt>Cupo</dt><dd>${ok ? pill("Disponible " + money(disp), "ok") : pill("Excede en " + money(f.total - disp), "bad")}</dd><dt>Existencias</dt><dd>${sinStock.length ? pill(sinStock.length + " sin existencia", "bad") : pill("Completas en " + suc(f.sucursalId).nombre.split(" ")[0], "ok")}</dd></dl>
      ${own ? `<div class="note warn">Tú registraste esta factura. Por segregación de funciones debe autorizarla otro gerente.</div>` : ""}
      <div class="row"><button class="btn sm" data-act="verFactura" data-id="${f.id}">Ver detalle</button><span style="flex:1"></span><button class="btn sm danger" data-act="rechazarDlg" data-id="${f.id}" ${own ? "disabled" : ""}>Rechazar</button><button class="btn sm primary" data-act="autorizar" data-id="${f.id}" ${own || !ok || sinStock.length ? "disabled" : ""}>Autorizar</button></div>
    </article>`; }).join("")}</div>` : `<div class="panel empty"><h2>No hay facturas por autorizar</h2><p>Cuando Logística registre una factura manual aparecerá aquí.</p></div>`}
  <section class="panel"><header><h2>Últimas decisiones</h2></header><div class="tw"><table><thead><tr><th>Factura</th><th>Decisión</th><th>Por</th><th>Fecha</th><th>Motivo</th></tr></thead><tbody>
  ${DB.facturas.filter(f => f.revisadoEn).sort((a, b) => b.revisadoEn.localeCompare(a.revisadoEn)).slice(0, 8).map(f => `<tr><td><button class="linklike mono" data-act="verFactura" data-id="${f.id}">${f.numero}</button></td><td>${pillFactura(f)}</td><td>${esc(usr(f.revisadoPor)?.nombre)}</td><td>${fdt(f.revisadoEn)}</td><td class="wrap">${esc(f.motivoRechazo || "")}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

  <div class="tabs" role="tablist">${tabsDef.map(([k, l, n]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-g="desp" data-v="${k}">${l}${n ? ` (${n})` : ""}</button>`).join("")}</div>
  ${tab === "por" ? (por.length ? `<div class="tw"><table><thead><tr><th>Factura</th><th>Autorizada</th><th>Cliente</th><th>Destino</th><th class="r">Líneas</th><th></th></tr></thead><tbody>${por.map(f => `<tr><td><button class="linklike mono" data-act="verFactura" data-id="${f.id}">${f.numero}</button></td><td>${fdt(f.revisadoEn)}</td><td>${esc(cli(f.clienteId).nombre)}</td><td>${esc(ciudad(f.ciudadDestinoId)?.nombre)}</td><td class="r">${f.items.length}</td><td><button class="btn sm primary" data-act="nuevaRemision" data-id="${f.id}">Crear remisión</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="panel empty">No hay facturas autorizadas pendientes de remisión.</div>`) : ""}
  ${tab === "act" ? (act.length ? `<div class="tw"><table><thead><tr><th>Remisión</th><th>Factura</th><th>Cliente</th><th>Destino</th><th>Transportadora</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${act.map(remRow).join("")}</tbody></table></div>` : `<div class="panel empty">No hay remisiones en proceso.</div>`) : ""}
  ${tab === "hist" ? `<div class="tw"><table><thead><tr><th>Remisión</th><th>Factura</th><th>Cliente</th><th>Destino</th><th>Transportadora</th><th>Estado</th><th>Entregada</th></tr></thead><tbody>${hist.map(remRow).join("")}</tbody></table></div>` : ""}
  ${tab === "nov" ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Remisión</th><th>Detalle</th><th>Estado</th><th></th></tr></thead><tbody>${nov.map(n => `<tr><td>${fdt(n.fecha)}</td><td>${esc(n.tipo)}</td><td class="mono">${esc(rem(n.remisionId)?.numero)}</td><td class="wrap">${esc(n.detalle)}${n.resolucion ? `<br><span class="muted">Resolución: ${esc(n.resolucion)}</span>` : ""}</td><td>${pill(n.estado, n.estado === "Abierta" ? "bad" : "ok")}</td><td>${n.estado === "Abierta" && (P("facturas.autorizar") || P("despachos.gestionar")) ? `<button class="btn sm" data-act="cerrarNovDlg" data-id="${n.id}">Cerrar</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Sin novedades.</td></tr>`}</tbody></table></div>` : ""}`;

const FLUJO_IMP = ["Orden emitida","En tránsito","En aduana","Nacionalizada","Recibida"];
function costeo(im){
  const fob = sum(im.items, it => it.cantidad * it.fobUSD);
  const cif = fob + im.fleteUSD + im.seguroUSD;
  const cifCOP = cif * im.trm, arancel = cifCOP * im.arancelPct / 100, ivaImp = (cifCOP + arancel) * IVA;
  const costoTotal = cifCOP + arancel; // IVA importación es descontable
  return { fob, cif, cifCOP, arancel, ivaImp, costoTotal, factor: fob ? costoTotal / (fob * im.trm) : 1 };
}

/* ---------- Formularios ---------- */
const FORM = {
  noop(){},
  login(){

  factura(){

    if (!d.ciudadId) E.ciudadId = "Elige la ciudad o municipio de destino.";
    if (!items.length) E.items = "Agrega al menos una referencia.";
    const ids = items.map(x => x.productoId);
    if (new Set(ids).size !== ids.length) E.items = "Hay referencias repetidas. Une las cantidades en una sola línea.";
    for (const it of items){
      const q = parseInt(it.cantidad); const p = prod(it.productoId);
      if (!(q > 0)){ E.items = `La cantidad de ${p.sku} debe ser un número entero mayor que cero.`; break; }
      if (q > (p.stock[d.sucursalId] || 0)){ E.items = `No hay existencia suficiente de ${p.sku} en ${suc(d.sucursalId).nombre}: hay ${p.stock[d.sucursalId] || 0}, pides ${q}.`; break; }

  remision(form){

  ajuste(form){
    const p = prod(form.dataset.id); const s = form.suc.value; const c = parseInt(form.cant.value); const det = form.detalle.value.trim();
    if (!c){ $("#aj-err").innerHTML = `<div class="note bad">La cantidad debe ser distinta de cero.</div>`; return; }
    if (det.length < 10){ $("#aj-err").innerHTML = `<div class="note bad">Describe el ajuste con al menos 10 caracteres.</div>`; return; }
    if ((p.stock[s] || 0) + c < 0){ $("#aj-err").innerHTML = `<div class="note bad">El ajuste dejaría existencia negativa (hay ${p.stock[s] || 0}).</div>`; return; }
    p.stock[s] = (p.stock[s] || 0) + c;
    DB.kardex.push({ fecha:new Date().toISOString(), productoId:p.id, sucursalId:s, tipo:"Ajuste: " + form.motivo.value, cantidad:c, ref:"AJ-" + String(nextNum("AJ")).padStart(4, "0"), usuario:ME.nombre });

  },
  traslado(form){
    const p = prod(form.prod.value), o = form.o.value, d = form.d.value, c = parseInt(form.cant.value);
    if (o === d){ $("#tr-err").innerHTML = `<div class="note bad">El origen y el destino deben ser distintos.</div>`; return; }
    if (!(c > 0) || c > (p.stock[o] || 0)){ $("#tr-err").innerHTML = `<div class="note bad">Cantidad no válida. En ${esc(suc(o).nombre)} hay ${p.stock[o] || 0}.</div>`; return; }
    p.stock[o] -= c; p.stock[d] = (p.stock[d] || 0) + c; const ref = "TR-" + String(nextNum("TR")).padStart(4, "0"); const ts = new Date().toISOString();
    DB.kardex.push({ fecha:ts, productoId:p.id, sucursalId:o, tipo:"Traslado salida", cantidad:-c, ref, usuario:ME.nombre }, { fecha:ts, productoId:p.id, sucursalId:d, tipo:"Traslado entrada", cantidad:c, ref, usuario:ME.nombre });
    audit("Trasladar inventario", "Producto", p.sku, `${c} de ${suc(o).nombre} a ${suc(d).nombre} · ${ref}`); closeDlg(); commit(); toast(`Traslado ${ref} registrado.`);
  },
  producto(form){

    if (!/^[A-Z0-9-]{4,20}$/.test(sku)){ $("#pr-err").innerHTML = `<div class="note bad">El SKU solo admite mayúsculas, números y guiones (4 a 20).</div>`; return; }

  cliente(form){

    if (DB.clientes.some(c => c.nit === nit && c.id !== id)) err.push("Ya existe un cliente con ese NIT.");

    } else {
      const c = { id:"C" + (DB.clientes.length + 1) + "-" + Date.now().toString(36), nombre:v.nombre.trim(), nit, ciudadId:v.ciudadId, direccion:v.direccion.trim(), contacto:v.contacto.trim(), telefono:v.telefono.trim(), cupo:+v.cupo || 0, activo:true, autorizaDatos:true };

  rastreo(form){

    const f = DB.facturas.find(x => x.numero === q); if (f && f.remisionId) extra = DB.audit.filter(e => e.ref === rem(f.remisionId).numero);
    const r = DB.remisiones.find(x => x.numero === q); if (r) extra = DB.audit.filter(e => e.ref === byId(DB.facturas, r.facturaId).numero);
    const all = [...ev, ...extra].sort((a, b) => a.seq - b.seq);

    render(); $("#rastreo-res")?.setAttribute("tabindex", "-1"); $("#rastreo-res")?.focus();

  certificado(form){ UI.certQ = form.codigo.value.trim().toUpperCase(); UI.certRes = resultadoCert(UI.certQ); render(); $("#cc")?.focus(); },
  ciudad(form){

    if (DB.ciudades.some(c => c.id === code)){ toast("Ya existe una ciudad con ese código.", true); return; }
    DB.ciudades.push({ id:code, estadoId:form.estadoId.value, nombre:nom }); audit("Crear ciudad o municipio", "Catálogo", code, nom); commit(); toast(nom + " agregado.");

  usuario(form){
    const v = Object.fromEntries(new FormData(form));
    if (!v.nombre.trim() || !/^[a-z0-9.]{3,20}$/.test(v.usuario)){ $("#us-err").innerHTML = `<div class="note bad">Completa el nombre y un usuario válido (minúsculas, 3 a 20).</div>`; return; }
    if (DB.usuarios.some(u => u.usuario === v.usuario)){ $("#us-err").innerHTML = `<div class="note bad">Ese usuario ya existe.</div>`; return; }

/* ---------- Eventos (delegación) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.tagName === "A" && b.getAttribute("href") === "#") e.preventDefault();
  if (b.dataset.act === "verifPublico") e.preventDefault();
  const fn = ACT[b.dataset.act]; if (fn && !b.disabled) fn(b.dataset, b);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const fn = FORM[f.dataset.form]; if (fn) fn(f);
});
let tIn;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.in){ clearTimeout(tIn); const k = t.dataset.in, v = t.value, id = t.id; tIn = setTimeout(() => { UI.filtros[k] = v; render(); const el = $("#" + id); if (el){ el.focus(); el.setSelectionRange(v.length, v.length); } }, 220); }
  if (t.dataset.item !== undefined && t.dataset.k === "cantidad"){ UI.draft.items[+t.dataset.item].cantidad = t.value; clearTimeout(tIn); const id = t.id; tIn = setTimeout(() => { const pos = t.selectionStart; render(); const el = $("#" + id); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} } }, 350); }
  if (t.dataset.draft === "obs") UI.draft.obs = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ch){ UI.filtros[t.dataset.ch] = t.value; render(); $("#" + t.id)?.focus(); }
  if (t.dataset.pref){ setPref(t.dataset.pref, t.checked); render(); $("#" + t.id)?.focus(); }
  if (t.dataset.draft && t.dataset.draft !== "obs"){
    const d = UI.draft; d[t.dataset.draft] = t.value;
    if (t.dataset.draft === "paisId"){ d.estadoId = DB.estados.find(x => x.paisId === t.value)?.id || ""; d.ciudadId = ""; }
    if (t.dataset.draft === "estadoId") d.ciudadId = "";
    if (t.dataset.draft === "clienteId" && t.value){ const c = cli(t.value); const ci = ciudad(c.ciudadId); d.ciudadId = c.ciudadId; d.estadoId = ci.estadoId; d.paisId = byId(DB.estados, ci.estadoId).paisId; }
    if (d.errores) delete d.errores[t.dataset.draft];
    render(); $("#" + t.id)?.focus();
  }
  if (t.dataset.item !== undefined && t.dataset.k === "productoId"){ UI.draft.items[+t.dataset.item].productoId = t.value; render(); $("#" + t.id)?.focus(); }
  if (t.dataset.perm){
    const r = t.dataset.rol, k = t.dataset.perm, arr = DB.roles[r];
    if (t.checked){ if (!arr.includes(k)) arr.push(k); } else DB.roles[r] = arr.filter(x => x !== k);
    audit(t.checked ? "Otorgar permiso" : "Revocar permiso", "Rol", r, PERMISOS[k]); save(); toast(`${r}: ${t.checked ? "puede" : "ya no puede"} ${PERMISOS[k].toLowerCase()}.`);
  }
